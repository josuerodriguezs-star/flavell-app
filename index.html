<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLAVELL — Mira</title>
    <script src="https://accounts.google.com/gsi/client"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0e27;
            --bg-secondary: #111829;
            --text-primary: #e8e8e8;
            --text-secondary: #888888;
            --accent-orange: #ff9d4d;
            --status-green: #4ade80;
            --status-red: #ef4444;
            --status-gray: #6b7280;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            height: 90vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 40px;
            position: relative;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.95);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            text-align: center;
        }

        .modal-title {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #fff;
        }

        .modal-subtitle {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .modal-agent {
            font-size: 12px;
            color: var(--accent-orange);
            font-weight: 600;
            margin-bottom: 32px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #google-signin-button {
            margin-top: 20px;
        }

        .header {
            text-align: center;
            width: 100%;
        }

        .header-title {
            font-size: 24px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 2px;
        }

        .header-agent {
            font-size: 11px;
            color: var(--accent-orange);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .header-user {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .header-phase {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 8px;
            font-style: italic;
        }

        .header-safety {
            font-size: 10px;
            color: var(--status-red);
            margin-top: 6px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            gap: 20px;
            position: relative;
        }

        .floating-text {
            font-size: 15px;
            line-height: 1.7;
            color: var(--text-primary);
            text-align: center;
            max-width: 90%;
            animation: fadeInOut 8s ease-in-out forwards;
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            letter-spacing: 0.3px;
        }

        @keyframes fadeInOut {
            0% { opacity: 0; transform: translateY(-40px); }
            10% { opacity: 1; transform: translateY(-50%); }
            90% { opacity: 1; transform: translateY(-50%); }
            100% { opacity: 0; transform: translateY(-10px); }
        }

        .mic-button {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: none;
            background: var(--status-green);
            color: white;
            font-size: 56px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 32px rgba(74, 222, 128, 0.3);
            font-weight: bold;
        }

        .mic-button.available {
            background: var(--status-green);
            box-shadow: 0 8px 32px rgba(74, 222, 128, 0.3);
        }

        .mic-button.available:hover {
            transform: scale(1.08);
            box-shadow: 0 12px 40px rgba(74, 222, 128, 0.5);
        }

        .mic-button.recording {
            background: var(--status-red);
            box-shadow: 0 0 30px rgba(239, 68, 68, 0.6);
            animation: pulse-record 0.8s infinite;
        }

        .mic-button.processing {
            background: var(--status-gray);
            box-shadow: 0 8px 32px rgba(107, 114, 128, 0.3);
            cursor: not-allowed;
        }

        .mic-button.closed {
            background: var(--status-red);
            cursor: not-allowed;
            opacity: 0.5;
        }

        @keyframes pulse-record {
            0%, 100% { 
                box-shadow: 0 0 20px rgba(239, 68, 68, 0.4);
                transform: scale(1);
            }
            50% { 
                box-shadow: 0 0 40px rgba(239, 68, 68, 0.8);
                transform: scale(1.02);
            }
        }

        .status {
            font-size: 12px;
            color: var(--text-secondary);
            text-align: center;
            min-height: 16px;
            letter-spacing: 0.5px;
            position: absolute;
            bottom: 0;
        }

        .status.active {
            color: var(--accent-orange);
            font-weight: 500;
        }

        .status.warning {
            color: var(--status-red);
            font-weight: 600;
        }

        .typing-dots {
            display: flex;
            gap: 6px;
            justify-content: center;
            position: absolute;
            bottom: 40px;
        }

        .typing-dot {
            width: 6px;
            height: 6px;
            background: var(--accent-orange);
            border-radius: 50%;
            animation: typingBounce 1.4s infinite;
        }

        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typingBounce {
            0%, 60%, 100% { opacity: 0.3; transform: translateY(0); }
            30% { opacity: 1; transform: translateY(-6px); }
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 600px) {
            .mic-button { 
                width: 100px; 
                height: 100px; 
                font-size: 48px;
            }
            .container {
                gap: 30px;
            }
        }
    </style>
</head>
<body>

    <div class="modal active" id="loginModal">
        <div class="modal-content">
            <div class="modal-title">FLAVELL</div>
            <div class="modal-subtitle">Evaluación Metacognitiva</div>
            <div class="modal-agent">Powered by Mira</div>
            <div id="google-signin-button"></div>
        </div>
    </div>

    <div class="container hidden" id="appContainer">
        
        <div class="header">
            <div class="header-title">FLAVELL</div>
            <div class="header-agent">Mira</div>
            <div class="header-user" id="userGreeting">Hola</div>
            <div class="header-phase" id="phaseIndicator">Fase 1: Planificación</div>
            <div class="header-safety" id="safetyIndicator"></div>
        </div>

        <div class="content" id="appContent">
            <button class="mic-button available" id="micButton">🎤</button>
            <div class="status" id="statusText">Presiona para hablar</div>
        </div>

    </div>

    <script>
        const CONFIG = {
            GOOGLE_CLIENT_ID: '1024048650335-et8uu1tgifepgbbfdh6hr7md1bb1hf7q.apps.googleusercontent.com',
            SHEETS_WEBHOOK: 'https://script.google.com/macros/s/AKfycbyUJVuKeuKY7OhaJQyKU66E1hawloxg-rZRW58zoSwPhu3fQpncZY5OegjrBYOKp9dW/exec',
            MAX_TURNS: 12,
            MAX_FAILED_ATTEMPTS: 3,
            API: {
                WHISPER: '/api/whisper',
                GPT: '/api/gpt',
                TTS: '/api/tts'
            }
        };

        const state = {
            userId: null,
            userName: null,
            userEmail: null,
            sessionId: null,
            turno: 0,
            fase: 1,
            isRecording: false,
            isProcessing: false,
            mediaRecorder: null,
            audioChunks: [],
            intentosFallidos: 0,
            respuestasValidas: [],
            respuestasInvalidas: [],
            sessionClosed: false,
            motivoCierre: null
        };

        // ===== GOOGLE AUTH =====
        function initGoogleAuth() {
            google.accounts.id.initialize({
                client_id: CONFIG.GOOGLE_CLIENT_ID,
                callback: handleGoogleLogin
            });

            google.accounts.id.renderButton(
                document.getElementById('google-signin-button'),
                { theme: 'outline', size: 'large', text: 'signin_with' }
            );
        }

        function handleGoogleLogin(response) {
            try {
                const base64Url = response.credential.split('.')[1];
                const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                const jsonPayload = decodeURIComponent(
                    atob(base64).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join('')
                );

                const userData = JSON.parse(jsonPayload);
                state.userId = userData.sub;
                state.userName = userData.name;
                state.userEmail = userData.email;
                state.sessionId = `${state.userId}-${Date.now()}`;

                document.getElementById('loginModal').classList.remove('active');
                document.getElementById('appContainer').classList.remove('hidden');
                document.getElementById('userGreeting').textContent = state.userName.split(' ')[0];

                startInterview();
            } catch (error) {
                console.error('Auth error:', error);
                updateStatus('Error en autenticación', 'error');
            }
        }

        // ===== INTERVIEW =====
        async function startInterview() {
            state.turno = 1;
            state.fase = 1;
            updateStatus('Iniciando...', 'active');

            try {
                const apertura = await callGPT('apertura', null);
                showFloatingText(apertura);
                await speakText(apertura);

                logToSheet({ 
                    turno: state.turno, 
                    fase: 1, 
                    speaker: 'mira', 
                    tipo: 'apertura', 
                    texto: apertura,
                    intentosFallidos: state.intentosFallidos
                });

                updateStatus('Presiona para hablar', 'active');
                setMicState('available');

            } catch (error) {
                console.error('Start error:', error);
                updateStatus('Error al iniciar', 'error');
            }
        }

        // ===== SAFETY: Detectar respuestas sin sentido =====
        function isValidResponse(text) {
            if (!text || text.trim().length === 0) return false;
            if (text.trim().length < 3) return false;
            if (/^[0-9\s\.\,\!\?]+$/.test(text.trim())) return false; // Solo números/puntuación
            if (text.toLowerCase() === 'no' || text.toLowerCase() === 'sí' || text.toLowerCase() === 'si') return false; // Respuestas muy cortas
            return true;
        }

        // ===== SAFETY: Cerrar sesión si hay demasiados intentos fallidos =====
        function handleFailedAttempt(userText) {
            state.intentosFallidos++;
            state.respuestasInvalidas.push({ turno: state.turno, texto: userText });

            const remaining = CONFIG.MAX_FAILED_ATTEMPTS - state.intentosFallidos;

            if (state.intentosFallidos >= CONFIG.MAX_FAILED_ATTEMPTS) {
                closeSession('Demasiados intentos sin respuestas válidas');
                return false;
            }

            updateSafetyIndicator();
            return true;
        }

        function handleSuccessfulAttempt(userText) {
            state.intentosFallidos = 0; // Reset contador
            state.respuestasValidas.push({ turno: state.turno, texto: userText });
            updateSafetyIndicator();
        }

        function updateSafetyIndicator() {
            const el = document.getElementById('safetyIndicator');
            if (state.intentosFallidos === 0) {
                el.textContent = '';
                el.style.display = 'none';
            } else {
                const remaining = CONFIG.MAX_FAILED_ATTEMPTS - state.intentosFallidos;
                el.textContent = `⚠️ ${remaining} intento${remaining !== 1 ? 's' : ''} restante${remaining !== 1 ? 's' : ''}`;
                el.style.display = 'block';
            }
        }

        function closeSession(motivo) {
            state.sessionClosed = true;
            state.motivoCierre = motivo;
            setMicState('closed');
            updateStatus(`Sesión cerrada: ${motivo}`, 'warning');

            logToSheet({
                turno: state.turno,
                fase: state.fase,
                speaker: 'sistema',
                tipo: 'cierre',
                texto: motivo,
                intentosFallidos: state.intentosFallidos,
                respuestasValidas: state.respuestasValidas.length,
                respuestasInvalidas: state.respuestasInvalidas.length
            });
        }

        // ===== MIC CONTROL =====
        async function startRecording() {
            if (state.sessionClosed) return;

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                state.mediaRecorder = new MediaRecorder(stream);
                state.audioChunks = [];

                state.mediaRecorder.ondataavailable = (event) => {
                    state.audioChunks.push(event.data);
                };

                state.mediaRecorder.onstop = async () => {
                    await processAudio();
                };

                state.mediaRecorder.start();
                state.isRecording = true;
                setMicState('recording');
                updateStatus('Escuchando...', 'active');

            } catch (error) {
                console.error('Mic error:', error);
                updateStatus('Error acceso micrófono', 'error');
            }
        }

        function stopRecording() {
            if (state.mediaRecorder && state.isRecording) {
                state.mediaRecorder.stop();
                state.isRecording = false;
                setMicState('processing');
                updateStatus('Procesando...', 'active');
            }
        }

        async function processAudio() {
            try {
                const audioBlob = new Blob(state.audioChunks, { type: 'audio/webm' });
                
                const formData = new FormData();
                formData.append('file', audioBlob, 'audio.webm');

                const transcriptResponse = await fetch(CONFIG.API.WHISPER, {
                    method: 'POST',
                    body: formData
                });

                if (!transcriptResponse.ok) {
                    throw new Error(`Whisper error: ${transcriptResponse.status}`);
                }

                const transcriptData = await transcriptResponse.json();
                const userText = transcriptData.text || '';

                if (!userText.trim()) {
                    updateStatus('No se capturó audio. Intenta de nuevo.', 'error');
                    setMicState('available');
                    return;
                }

                // ===== VALIDAR RESPUESTA =====
                if (!isValidResponse(userText)) {
                    showFloatingText(`"${userText}" - No parece una respuesta válida.`);
                    
                    if (!handleFailedAttempt(userText)) {
                        // Session cerrada por demasiados intentos
                        return;
                    }

                    logToSheet({ 
                        turno: state.turno, 
                        fase: state.fase, 
                        speaker: 'student', 
                        tipo: 'respuesta_invalida', 
                        texto: userText,
                        intentosFallidos: state.intentosFallidos
                    });

                    updateStatus('Respuesta no válida. Intenta de nuevo.', 'error');
                    setMicState('available');
                    return;
                }

                // ===== RESPUESTA VÁLIDA =====
                handleSuccessfulAttempt(userText);
                showFloatingText(userText);

                logToSheet({ 
                    turno: state.turno + 0.5, 
                    fase: state.fase, 
                    speaker: 'student', 
                    tipo: 'respuesta', 
                    texto: userText,
                    intentosFallidos: state.intentosFallidos
                });

                const newPhase = detectPhase(userText);
                if (newPhase !== state.fase) {
                    state.fase = newPhase;
                    updatePhase(newPhase);
                }

                state.turno++;
                updateStatus('Reflexionando...', 'active');
                showTyping();
                setMicState('processing');

                const response = await callGPT(state.fase, userText);
                hideTyping();

                showFloatingText(response);
                setMicState('processing');
                await speakText(response);

                logToSheet({ 
                    turno: state.turno, 
                    fase: state.fase, 
                    speaker: 'mira', 
                    tipo: 'respuesta', 
                    texto: response,
                    intentosFallidos: state.intentosFallidos
                });

                if (state.turno >= CONFIG.MAX_TURNS) {
                    closeSession('Sesión completada');
                } else {
                    updateStatus('Presiona para hablar', 'active');
                    setMicState('available');
                }

            } catch (error) {
                console.error('Audio error:', error);
                hideTyping();
                updateStatus('Error procesando audio', 'error');
                setMicState('available');
            }
        }

        // ===== GPT CALL =====
        async function callGPT(phase, userText) {
            try {
                const systemPrompt = buildSystemPrompt(phase);
                const userPrompt = buildUserPrompt(phase, userText);

                const response = await fetch(CONFIG.API.GPT, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ systemPrompt, userMessage: userPrompt })
                });

                const data = await response.json();
                if (!response.ok) throw new Error(data.error || 'GPT error');
                return data.text;

            } catch (error) {
                console.error('GPT error:', error);
                return 'Disculpa, hubo un error. Intenta de nuevo.';
            }
        }

        // ===== TTS =====
        async function speakText(text) {
            try {
                const response = await fetch(CONFIG.API.TTS, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text })
                });

                const data = await response.json();
                if (!response.ok) throw new Error(data.error || 'TTS error');

                const audioUrl = `data:audio/mp3;base64,${data.audio}`;
                const audio = new Audio(audioUrl);

                return new Promise((resolve) => {
                    audio.onended = resolve;
                    audio.onerror = () => resolve();
                    audio.play().catch(() => resolve());
                });

            } catch (error) {
                console.error('TTS error:', error);
            }
        }

        // ===== PROMPTS =====
        function buildSystemPrompt(phase) {
            const base = `Eres Mira, evaluador metacognitivo experto. REGLAS: Responde en español, máximo 2-3 oraciones, sin asteriscos.`;
            const guides = {
                1: 'FASE 1 - PLANIFICACIÓN: Pregunta sobre comprensión de tarea, estrategias.',
                2: 'FASE 2 - EJECUCIÓN: Pregunta qué cuesta, si chequea progreso.',
                3: 'FASE 3 - REFLEXIÓN: Pregunta qué aprendió, qué haría diferente.'
            };
            return base + '\n' + guides[phase];
        }

        function buildUserPrompt(phase, userText) {
            if (!userText) return 'Comienza: "Hola, soy Mira. Cuéntame, ¿en qué estás trabajando ahorita?"';
            return `Respuesta: "${userText}"\n\nUna pregunta para FASE ${phase}.`;
        }

        function detectPhase(text) {
            const lower = text.toLowerCase();
            if (/terminé|acabé|finalizé|aprendí/.test(lower)) return 3;
            if (/empecé|estoy|hice|leyendo|haciendo/.test(lower)) return 2;
            return 1;
        }

        // ===== LOGGING =====
        async function logToSheet(data) {
            try {
                await fetch(CONFIG.SHEETS_WEBHOOK, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: JSON.stringify({
                        sessionId: state.sessionId,
                        userId: state.userId,
                        userEmail: state.userEmail,
                        userName: state.userName,
                        ...data
                    })
                });
            } catch (error) {
                // Silent fail
            }
        }

        // ===== UI =====
        function showFloatingText(text) {
            document.querySelectorAll('.floating-text').forEach(el => el.remove());
            const div = document.createElement('div');
            div.className = 'floating-text';
            div.textContent = text;
            document.getElementById('appContent').appendChild(div);
            setTimeout(() => div.remove(), 8000);
        }

        function showTyping() {
            const div = document.createElement('div');
            div.id = 'typingIndicator';
            div.className = 'typing-dots';
            div.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';
            document.getElementById('appContent').appendChild(div);
        }

        function hideTyping() {
            document.getElementById('typingIndicator')?.remove();
        }

        function updateStatus(text, type = '') {
            const el = document.getElementById('statusText');
            el.textContent = text;
            el.className = `status ${type === 'active' ? 'active' : type === 'error' ? 'warning' : ''}`;
        }

        function updatePhase(phase) {
            const labels = { 1: 'Planificación', 2: 'Ejecución', 3: 'Reflexión' };
            document.getElementById('phaseIndicator').textContent = `Fase ${phase}: ${labels[phase]}`;
        }

        function setMicState(state) {
            const btn = document.getElementById('micButton');
            btn.className = `mic-button ${state}`;
            btn.disabled = state !== 'available';

            if (state === 'available') {
                btn.onmousedown = startRecording;
                btn.onmouseup = stopRecording;
                btn.ontouchstart = (e) => { e.preventDefault(); startRecording(); };
                btn.ontouchend = (e) => { e.preventDefault(); stopRecording(); };
            }
        }

        // ===== INIT =====
        window.addEventListener('DOMContentLoaded', initGoogleAuth);
    </script>

</body>
</html>
