        // =====================================================

        const VIGIL = {

            // Apertura pública: Vigil
            apertura: "Hola, soy Vigil. Cuéntame, ¿en qué estás trabajando en este momento? No importa si es una tarea, algo que leíste, algún proceso de tu trabajo o algo respecto a tus materias. Lo que quieras que analicemos juntos.",

            replanteamientos: {

                ],

                ]
            },

            cierres: {
                exitoso:    "Creo que llegaste a algo importante hoy. Guárdalo en algún lugar, porque ese tipo de cosas se olvidan rápido. Hasta la próxima.",
                incompleto: "Quedamos a medias, pero el proceso ya empezó. Sigue pensando en eso cuando puedas.",
                frustrado:  "Está bien si hoy no salió. Hay sesiones así. Vuelve cuando tengas más energía para esto."
            }

        // =====================================================
        // ANÁLISIS ESTADÍSTICO Y MATEMÁTICO DE MÉTRICAS
        // (Procesamiento del lado del frontend — equivalente al "back" de la lógica Elia)
        // =====================================================
        const MetricEngine = {

            /**
             * Complejidad de respuesta (0–100)
             * Combina longitud, densidad léxica y especificidad procedimental.
             */
            computeComplexityScore(text) {
                const words = text.trim().split(/\s+/);
                const wordCount = words.length;
                if (wordCount === 0) return 0;

                // 1. Score por longitud normalizado (logístico, satura en ~80 palabras)
                const lengthScore = Math.min(100, (wordCount / 80) * 100);

                // 2. Densidad léxica: palabras únicas / total (riqueza de vocabulario)
                const unique = new Set(words.map(w => w.toLowerCase().replace(/[^a-záéíóúüñ]/gi, ''))).size;
                const lexicalDensity = (unique / wordCount) * 100;

                // 3. Especificidad procedimental: presencia de verbos de acción concretos
                const proceduralVerbs = /hice|hizo|realicé|apliqué|usé|probé|intenté|calculé|resolví|analicé|construí|diseñé|ejecuté|desarrollé|escribí|leí|estudié|revisé|corregí|planifiqué|organicé|decidí|elegí|cambié|ajusté|medí|comparé|identifiqué|encontré|descubrí/i;
                const hasProceduralVerbs = proceduralVerbs.test(text) ? 30 : 0;

                // Promedio ponderado
                const score = (lengthScore * 0.4) + (lexicalDensity * 0.3) + hasProceduralVerbs;
                return Math.round(Math.min(100, score));
            },

            /**
             * Score de abstracción lógica (0–100)
             * Mide si el estudiante razona sobre su proceso, no solo lo describe.
             */
            computeAbstractionScore(text) {
                const lower = text.toLowerCase();
                let score = 0;

                // Causalidad: conecta causas con efectos
                if (/porque|por eso|por eso|debido a|esto causó|esto provocó|lo que hizo que|entonces/.test(lower)) score += 25;

                // Condición: razonamiento hipotético o condicional
                if (/si hubiera|si lo hago|si repito|la próxima vez|si cambiara|hubiera podido|debería haber/.test(lower)) score += 25;

                // Metacognición explícita: habla de su propio proceso de pensar
                if (/me di cuenta|noté que|entendí que|me equivoqué|cometí un error|lo que me faltó|lo que aprendí|reflexioné|analicé mi/.test(lower)) score += 25;

                // Comparación con expectativa previa
                if (/esperaba|pensé que|creía que|suponía|resultó que|al final|de lo que pensé/.test(lower)) score += 25;

                return Math.min(100, score);
            },

            /**
             * Score de autorregulación (0–100)
             * Qué tan activamente el estudiante ajustó su proceso.
             */
            computeSelfRegulationScore(text) {
                const lower = text.toLowerCase();
                let score = 0;

                // Monitoreo: checar avance
                if (/revisé|checé|verifiqué|me aseguré|comprobé|confirmé|validé|supervisé/.test(lower)) score += 30;

                // Ajuste de estrategia
                if (/cambié|ajusté|modifiqué|adapté|decidí hacer diferente|opté por|en lugar de|en vez de/.test(lower)) score += 35;

                // Gestión del error
                if (/me equivoqué|corregí|volví a intentar|rehíce|replanteé|retrocedí|empecé de nuevo/.test(lower)) score += 35;

                return Math.min(100, score);
            },

            /**
             * Score de ubicación del proceso (0–100)
             * El estudiante demuestra saber exactamente dónde estaba en su proceso.
             */
            computeProcessLocationScore(text) {
                const lower = text.toLowerCase();
                let score = 0;

                // Secuenciación: usa conectores de orden
                if (/primero|luego|después|al final|antes de|una vez que|tras|finalmente|en ese punto|en ese momento/.test(lower)) score += 30;

                // Referencia a un paso específico
                if (/en la parte de|en el punto|en ese paso|en esa etapa|ahí fue cuando|fue entonces|en ese momento específico/.test(lower)) score += 35;

                // Mencionan producto concreto del proceso
                if (/el resultado|el output|lo que produje|lo que entregué|el documento|el código|la fórmula|la respuesta|el cálculo|la tarea|el reporte/.test(lower)) score += 35;

                return Math.min(100, score);
            },

            /**
             * Evalúa el conjunto de respuestas de la sesión.
             * Devuelve el perfil estadístico completo.
             */
            computeSessionProfile(metricsMap) {
                const entries = Object.values(metricsMap);
                if (entries.length === 0) return null;

                const extract = key => entries.map(e => e[key] || 0);

                const complexity    = extract('complexityScore');
                const abstraction   = extract('abstractionScore');
                const selfReg       = extract('selfRegulationScore');
                const procLocation  = extract('processLocationScore');
                const latencies     = extract('latencia');
                const wordCounts    = extract('numPalabras');

                return {
                    // Promedios
                    avgComplexity:       avg(complexity),
                    avgAbstraction:      avg(abstraction),
                    avgSelfRegulation:   avg(selfReg),
                    avgProcessLocation:  avg(procLocation),
                    avgLatencia:         avg(latencies),
                    avgPalabras:         avg(wordCounts),

                    // Tendencia: ¿mejora con el tiempo?
                    complexityTrend:     linearTrend(complexity),
                    abstractionTrend:    linearTrend(abstraction),

                    // Dispersión (desviación estándar) — coherencia entre respuestas
                    stdComplexity:       std(complexity),
                    stdAbstraction:      std(abstraction),

                    // Score compuesto de metacognición (ponderado)
                    metacognitionIndex:  Math.round(
                        avg(complexity)   * 0.20 +
                        avg(abstraction)  * 0.35 +
                        avg(selfReg)      * 0.25 +
                        avg(procLocation) * 0.20
                    )
                };
            }
        };

        // Utilidades estadísticas
        function avg(arr)  { return arr.length ? Math.round(arr.reduce((a, b) => a + b, 0) / arr.length) : 0; }
        function std(arr)  {
            if (arr.length < 2) return 0;
            const mean = arr.reduce((a, b) => a + b, 0) / arr.length;
            return Math.round(Math.sqrt(arr.reduce((s, v) => s + (v - mean) ** 2, 0) / arr.length));
        }
        function linearTrend(arr) {
            // Pendiente de mínimos cuadrados: positiva = mejora, negativa = declive
            if (arr.length < 2) return 0;
            const n = arr.length;
            const xs = arr.map((_, i) => i);
            const sumX  = xs.reduce((a, b) => a + b, 0);
            const sumY  = arr.reduce((a, b) => a + b, 0);
            const sumXY = xs.reduce((s, x, i) => s + x * arr[i], 0);
            const sumX2 = xs.reduce((s, x) => s + x * x, 0);
            const slope = (n * sumXY - sumX * sumY) / (n * sumX2 - sumX * sumX);
            return Math.round(slope * 100) / 100;
        }

        // =====================================================
        // PERSISTENCIA
        // =====================================================
        function saveSessionState() {
            const sessionData = {
                userId:    state.userId,
                userName:  state.userName,
                userEmail: state.userEmail,
                sessionId: state.sessionId,
                turno:     state.turno,

                startTime:  state.startTime,
                metrics:    state.metrics,
                rephraseCount: state.rephraseCount,
                lastQuestionIndex: state.lastQuestionIndex,
                timestamp: Date.now()
            };
            localStorage.setItem(`flavell-session-${state.sessionId}`, JSON.stringify(sessionData));
            console.log('💾 Sesión guardada:', state.sessionId);
        }

        function checkSessionRecovery(userId) {
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key && key.startsWith('flavell-session-')) {
                    const data = JSON.parse(localStorage.getItem(key));
                    if (data.userId === userId && !data.sessionClosed && data.turno > 1) {
                        if ((Date.now() - data.timestamp) < 7200000) return data;
                    }
                }
            }
            return null;
        }

        // =====================================================
        // GOOGLE AUTH
        // =====================================================
        function initGoogleAuth() {
            if (typeof google === 'undefined' || !google.accounts) {
                setTimeout(initGoogleAuth, 500);
                return;
            }
            try {
                google.accounts.id.initialize({
                    client_id: CONFIG.GOOGLE_CLIENT_ID,
                    callback: handleGoogleLogin
                });
                google.accounts.id.renderButton(
                    document.getElementById('google-signin-button'),
                    { theme: 'outline', size: 'large', text: 'signin_with' }
                );
            } catch (error) {
                console.error('❌ Error Google Auth:', error);
            }
        }

        function handleGoogleLogin(response) {
            try {
                const base64 = response.credential.split('.')[1]
                    .replace(/-/g, '+').replace(/_/g, '/');
                const userData = JSON.parse(decodeURIComponent(
                    atob(base64).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join('')
                ));
                state.userId    = userData.sub;
                state.userName  = userData.name;
                state.userEmail = userData.email;

                const recovered = checkSessionRecovery(state.userId);
                if (recovered && recovered.turno > 1) {
                    showRecoveryOption(recovered);
                } else {
                    startNewSession();
                }
            } catch (error) {
                console.error('❌ Login error:', error);
            }
        }

        function showRecoveryOption(recovered) {
            const msg = document.getElementById('recoveryMessage');
            msg.textContent = `Encontramos una sesión anterior en Fase ${recovered.fase} con ${recovered.turno} turnos. ¿Deseas continuar?`;
            msg.classList.remove('hidden');
            const buttons = document.getElementById('recoveryButtons');
            buttons.innerHTML = `
                <button class="btn-continue" onclick="continueSession()">Continuar Sesión</button>
                <button class="btn-restart" onclick="startNewSession()">Iniciar Nueva</button>
            `;
            buttons.classList.remove('hidden');
        }

        function continueSession() {
            const recovered = checkSessionRecovery(state.userId);
            if (!recovered) return;
            Object.assign(state, {
                sessionId:         recovered.sessionId,
                turno:             recovered.turno,
                fase:              recovered.fase,
                respuestas:        recovered.respuestas,
                indicators:        recovered.indicators,
                startTime:         recovered.startTime,
                metrics:           recovered.metrics,
                rephraseCount:     recovered.rephraseCount || {},
                lastQuestionIndex: recovered.lastQuestionIndex || {},
                lastActivityTime:  Date.now()
            });
            openApp();
            logToSheet({ tipo: 'recuperacion', texto: `Sesión recuperada en Fase ${state.fase}, turno ${state.turno}`, estadoSesion: 'recuperada' });
            continueFromPhase();
        }

        function startNewSession() {
            Object.assign(state, {
                sessionId:         `${state.userId}-${Date.now()}`,
                turno:             0,
                fase:              1,
                respuestas:        [],
                indicators:        [],
                startTime:         Date.now(),
                metrics:           {},
                rephraseCount:     {},
                lastQuestionIndex: {},
                lastActivityTime:  Date.now()
            });
            openApp();
            startInterview();
        }

        function openApp() {
            document.getElementById('loginModal').classList.remove('active');
            document.getElementById('appContainer').classList.remove('hidden');
            document.getElementById('userGreeting').textContent = state.userName.split(' ')[0];
        }

        // =====================================================
        // FLUJO DE ENTREVISTA
        // =====================================================
        async function startInterview() {
            state.turno = 1;
            state.fase  = 1;
            state.lastTurnoTime = Date.now();
            updateStatus('Iniciando...', 'active');
            updateProgress();
            showMiraText(VIGIL.apertura);
            setMicState('speaking');
            await speakText(VIGIL.apertura);
            setMicState('available');
            updateStatus('Presiona para hablar', 'active');

            logToSheet({
                turno: state.turno, fase: state.fase,
                speaker: 'vigil', tipo: 'apertura',
                texto: VIGIL.apertura, latencia: 0, elaboracion: 'N/A'
            });
            saveSessionState();
        }

        async function continueFromPhase() {
            updateStatus('Sesión recuperada', 'success');
            updateProgress();
            const labels = { 1: 'Planificación', 2: 'Ejecución', 3: 'Reflexión' };
            const msg = `Retomamos donde nos quedamos. Estamos en Fase ${state.fase}: ${labels[state.fase]}. Adelante.`;
            showMiraText(msg);
            setMicState('speaking');
            await speakText(msg);
            state.turno++;
            await askNextQuestion();
        }

        // =====================================================
        // DETECCIÓN DE FASE
        // =====================================================
        function detectPhase(text) {
            const lower = text.toLowerCase();
            if (/terminé|acabé|finalizé|completé|aprendí|descubrí|entendí|me di cuenta|resultó|funcionó|no funcionó|conclusión|resultado|logré|conseguí|dominé|comprendí|asimilé|reflexiono|pensé|analice|evalúe|consideré|mejoraría|cambiaría|siguiente vez|próxima|error|equivocación|reto|desafío/.test(lower)) return 3;
            if (/empecé|estoy|hice|haciendo|leyendo|escribiendo|resolviendo|calculando|analizando|buscando|investigando|encontré|revisando|checando|probando|intentando|aplicando|usando|ejecutando|realizando|desarrollando|construyendo|creando|practique|trabaje|intente|realice|desarrollo|construyo|cree/.test(lower)) return 2;
            return 1;
        }

        // =====================================================
        // DETECCIÓN DE INDICADORES METACOGNITIVOS
        // =====================================================
        function detectIndicators(text) {
            const lower = text.toLowerCase();
            const detected = [];

            // Atribución interna: el estudiante se reconoce como agente
            if (/decidí|elegí|cambié mi estrategia|me di cuenta|aprendí|entendí|logré|conseguí|hice diferente|fue porque|decidí que|cambié de|mejoré mi/.test(lower))
                detected.push('atribución_interna');

            // Inferencia adaptativa: proyecta mejora futura con procedimiento concreto
            if (/próxima vez|siguiente|haría diferente|cambiaría|mejoraría|si lo repito|para la próxima|específicamente|primero|después/.test(lower))
                detected.push('inferencia_adaptativa');

            // Síntesis propia: respuesta suficientemente elaborada
            if (text.length > 50 && text.split(' ').length > 10)
                detected.push('síntesis_propia');

            // Bordes precisos: distingue qué sabe y qué no con precisión
            if (/entendí bien|no me quedó clara|en la parte de|pero todavía|claramente|específicamente|esto sí|esto no/.test(lower))
                detected.push('bordes_precisos');

            // Ubicación de proceso: sabe exactamente dónde estaba
            if (/primero|luego|después|al final|en ese paso|en esa etapa|fue entonces|en ese momento/.test(lower))
                detected.push('ubicación_proceso');

            // Autorregulación demostrada: ajustó su proceso activamente
            if (/revisé|checé|verifiqué|cambié|ajusté|modifiqué|adapté|corregí|volví a intentar|rehíce/.test(lower))
                detected.push('autorregulación_demostrada');

            return detected;
        }

        // =====================================================
        // CLASIFICACIÓN DE ELABORACIÓN
        // =====================================================
        function classifyElaboration(text) {
            const words = text.trim().split(/\s+/).length;
            if (words < 5)  return 'breve';
            if (words < CONFIG.MIN_WORDS_ELABORATED) return 'moderada';
            return 'elaborada';
        }

        // =====================================================
        // CIERRE DE SESIÓN
        // =====================================================
        function shouldClose() {
            if (state.respuestas.length < CONFIG.MIN_RESPONSES_TO_CLOSE) return false;
            return state.indicators.length >= CONFIG.MIN_INDICATORS_TO_CLOSE;
        }

        // =====================================================
        // GRABACIÓN Y PROCESAMIENTO DE AUDIO
        // =====================================================
        async function startRecording() {
            if (state.sessionClosed || state.isSpeaking) return;
            try {
                state.lastTurnoTime = Date.now();
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                state.mediaRecorder = new MediaRecorder(stream);
                state.audioChunks = [];
                state.mediaRecorder.ondataavailable = e => state.audioChunks.push(e.data);
                state.mediaRecorder.onstop = processAudio;
                state.mediaRecorder.start();
                state.isRecording = true;
                setMicState('recording');
                updateStatus('Hablando...', 'active');
            } catch (err) {
                console.error('Mic error:', err);
                updateStatus('Error micrófono', 'error');
            }
        }

        function stopRecording() {
            if (state.mediaRecorder && state.isRecording) {
                state.mediaRecorder.stop();
                state.isRecording = false;
                setMicState('processing');
                updateStatus('Procesando...', 'active');
            }
        }

        async function processAudio() {
            try {
                const blob   = new Blob(state.audioChunks, { type: 'audio/webm' });
                const reader = new FileReader();

                reader.onload = async () => {
                    try {
                        const audioBase64 = reader.result.split(',')[1];
                        const res  = await fetch(CONFIG.API.WHISPER, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ audio: audioBase64 })
                        });

                        if (!res.ok) throw new Error(`Whisper error: ${res.status}`);
                        const { text: userText = '' } = await res.json();

                        if (!userText.trim() || userText.length < 3) {
                            updateStatus('No se capturó audio. Intenta de nuevo.', 'error');
                            setMicState('available');
                            return;
                        }

                        // ---- CÁLCULO DE MÉTRICAS COMPLETAS ----
                        const latencia    = Date.now() - state.lastTurnoTime;
                        const numPalabras = userText.trim().split(/\s+/).length;
                        const longitud    = userText.length;
                        const elaboracion = classifyElaboration(userText);

                        // Scores estadísticos (Motor Flavell)
                        const complexityScore    = MetricEngine.computeComplexityScore(userText);
                        const abstractionScore   = MetricEngine.computeAbstractionScore(userText);
                        const selfRegulationScore= MetricEngine.computeSelfRegulationScore(userText);
                        const processLocationScore=MetricEngine.computeProcessLocationScore(userText);

                        state.metrics[state.turno] = {
                            latencia, longitud, numPalabras, elaboracion,
                            complexityScore, abstractionScore,
                            selfRegulationScore, processLocationScore
                        };

                        console.log(`📊 Turno ${state.turno} métricas:`, state.metrics[state.turno]);

                        // ---- MOSTRAR RESPUESTA DEL ESTUDIANTE ----
                        showStudentText(userText);
                        state.respuestas.push(userText);

                        logToSheet({
                            turno: state.turno, fase: state.fase,
                            speaker: 'student', tipo: 'respuesta',
                            texto: userText,
                            latencia, longitudRespuesta: longitud, numPalabras, elaboracion,
                            complexityScore, abstractionScore,
                            selfRegulationScore, processLocationScore
                        });

                        // ---- DETECCIÓN DE FASE E INDICADORES ----
                        const newPhase = detectPhase(userText);
                        if (newPhase !== state.fase) { state.fase = newPhase; updatePhase(newPhase); }

                        const newIndicators = detectIndicators(userText);
                        state.indicators.push(...newIndicators);

                        state.turno++;
                        state.lastActivityTime = Date.now();
                        updateProgress();
                        saveSessionState();

                        // ---- ¿REPLANTEAMIENTO O SIGUIENTE PREGUNTA? ----
                        if (elaboracion === 'breve') {
                            await askRephrasedQuestion();
                        } else if (shouldClose() || state.turno > CONFIG.MAX_TURNS) {
                            await closeSession();
                        } else {
                            await askNextQuestion();
                        }

                    } catch (err) {
                        console.error('Processing error:', err);
                        updateStatus('Error procesando', 'error');
                        setMicState('available');
                    }
                };

                reader.readAsDataURL(blob);
            } catch (err) {
                console.error('Audio error:', err);
                updateStatus('Error de audio', 'error');
                setMicState('available');
            }
        }

        // =====================================================
        // PREGUNTAR — Siguiente pregunta en turno
        // =====================================================
        async function askNextQuestion() {
            updateStatus('Vigil reflexiona...', 'active');
            showTyping();
            setMicState('processing');

            try {
                const phaseQuestions = VIGIL.preguntas[state.fase];
                // Guardar el índice de la última pregunta para no repetir antes de tiempo
                const currentIdx = state.lastQuestionIndex[state.fase] !== undefined
                    ? (state.lastQuestionIndex[state.fase] + 1) % phaseQuestions.length
                    : 0;
                state.lastQuestionIndex[state.fase] = currentIdx;

                const question = phaseQuestions[currentIdx];
                hideTyping();
                clearDialogue();
                showMiraText(question);
                setMicState('speaking');
                await speakText(question);

                logToSheet({
                    turno: state.turno, fase: state.fase,
                    speaker: 'vigil', tipo: 'pregunta',
                    texto: question, latencia: 0, elaboracion: 'N/A'
                });

                setMicState('available');
                updateStatus('Presiona para hablar', 'active');
                saveSessionState();

            } catch (err) {
                console.error('Question error:', err);
                updateStatus('Error', 'error');
                setMicState('available');
            }
        }

        // =====================================================
        // REPLANTEAMIENTO — Cuando la respuesta es breve/vaga
        // =====================================================
        async function askRephrasedQuestion() {
            updateStatus('Vigil insiste...', 'active');
            showTyping();
            setMicState('processing');

            // Llevar conteo de replanteamientos para no ciclar
            const key = `${state.fase}-${state.turno}`;
            state.rephraseCount[key] = (state.rephraseCount[key] || 0) + 1;

            // Si ya se replanteó 2 veces, pasar a la siguiente pregunta
            if (state.rephraseCount[key] > 2) {
                hideTyping();
                await askNextQuestion();
                return;
            }

            const rephrases = VIGIL.replanteamientos[state.fase];
            const idx = (state.rephraseCount[key] - 1) % rephrases.length;
            const rephrase = rephrases[idx];

            hideTyping();
            clearDialogue();
            showMiraText(rephrase);
            setMicState('speaking');
            await speakText(rephrase);

            logToSheet({
                turno: state.turno, fase: state.fase,
                speaker: 'vigil', tipo: 'replanteamiento',
                texto: rephrase, latencia: 0, elaboracion: 'N/A'
            });

            setMicState('available');
            updateStatus('Presiona para hablar', 'active');
            saveSessionState();
        }

        // =====================================================
        // CIERRE DE SESIÓN
        // =====================================================
        async function closeSession() {
            state.sessionClosed = true;
            setMicState('closed');

            let closeMsg = VIGIL.cierres.exitoso;
            if (state.indicators.length === 0) closeMsg = VIGIL.cierres.frustrado;
            else if (state.indicators.length === 1) closeMsg = VIGIL.cierres.incompleto;

            clearDialogue();
            showMiraText(closeMsg);
            setMicState('speaking');
            updateStatus('Sesión completada ✓', 'success');
            await speakText(closeMsg);

            // Perfil estadístico final de la sesión
            const profile = MetricEngine.computeSessionProfile(state.metrics);
            console.log('📈 Perfil estadístico de sesión:', profile);

            try {
                await logToSheet({
                    turno: state.turno, fase: state.fase,
                    speaker: 'vigil', tipo: 'cierre',
                    texto: closeMsg,
                    indicadoresDetectados: state.indicators.join('|'),
                    estadoSesion: 'completada',
                    // Métricas agregadas de la sesión
                    metacognitionIndex:  profile?.metacognitionIndex  || 0,
                    avgComplexity:       profile?.avgComplexity        || 0,
                    avgAbstraction:      profile?.avgAbstraction       || 0,
                    avgSelfRegulation:   profile?.avgSelfRegulation    || 0,
                    avgProcessLocation:  profile?.avgProcessLocation   || 0,
                    complexityTrend:     profile?.complexityTrend      || 0,
                    abstractionTrend:    profile?.abstractionTrend     || 0
                });
            } catch (err) {
                console.error('❌ Error registrando cierre:', err);
            }

            localStorage.removeItem(`flavell-session-${state.sessionId}`);
            saveSessionState();
            setTimeout(() => downloadSessionReport(), 1000);
        }

        // =====================================================
        // TTS
        // =====================================================
        async function speakText(text) {
            state.isSpeaking = true;
            try {
                const res  = await fetch(CONFIG.API.TTS, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error);

                const audio = new Audio(`data:audio/mp3;base64,${data.audio}`);
                return new Promise(resolve => {
                    const timeout = setTimeout(() => { state.isSpeaking = false; resolve(); }, CONFIG.TTS_TIMEOUT);
                    const done = () => { clearTimeout(timeout); state.isSpeaking = false; resolve(); };
                    audio.onended = done;
                    audio.onerror = done;
                    audio.play().catch(done);
                });
            } catch (err) {
                console.error('TTS error:', err);
                state.isSpeaking = false;
            }
        }

        // =====================================================
        // LOG A GOOGLE SHEETS
        // =====================================================
        async function logToSheet(data) {
            try {
                const payload = {
                    userId:    state.userId,
                    sessionId: state.sessionId,
                    userEmail: state.userEmail,
                    userName:  state.userName,
                    turno:     data.turno     || '',
                    fase:      data.fase      || '',
                    speaker:   data.speaker   || '',
                    tipo:      data.tipo      || '',
                    texto:     data.texto     || '',
                    latencia:              data.latencia              || '',
                    longitudRespuesta:     data.longitudRespuesta     || '',
                    numPalabras:           data.numPalabras           || '',
                    elaboracion:           data.elaboracion           || '',
                    // Scores individuales por turno
                    complexityScore:       data.complexityScore       || '',
                    abstractionScore:      data.abstractionScore      || '',
                    selfRegulationScore:   data.selfRegulationScore   || '',
                    processLocationScore:  data.processLocationScore  || '',
                    // Métricas agregadas (solo en cierre)
                    metacognitionIndex:    data.metacognitionIndex    || '',
                    avgComplexity:         data.avgComplexity         || '',
                    avgAbstraction:        data.avgAbstraction        || '',
                    avgSelfRegulation:     data.avgSelfRegulation     || '',
                    avgProcessLocation:    data.avgProcessLocation    || '',
                    complexityTrend:       data.complexityTrend       || '',
                    abstractionTrend:      data.abstractionTrend      || '',
                    indicadoresDetectados: data.indicadoresDetectados || '',
                    estadoSesion:          data.estadoSesion          || 'en_progreso'
                };

                await fetch(CONFIG.SHEETS_WEBHOOK, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: JSON.stringify(payload)
                });

                console.log('✅ Registrado en sheet');
            } catch (err) {
                console.error('Log error:', err);
            }
        }

        // =====================================================
        // REPORTE DE SESIÓN
        // =====================================================
        function generateSessionReport() {
            const BOM = '\uFEFF';
            const faseLabels = { 1: 'Planificación', 2: 'Ejecución', 3: 'Reflexión' };
            const timestamp  = new Date().toLocaleString('es-MX');
            const duration   = Math.round((Date.now() - state.startTime) / 1000);
            const minutes    = Math.floor(duration / 60);
            const seconds    = duration % 60;
            const profile    = MetricEngine.computeSessionProfile(state.metrics);

            let report = `# EVALUACIÓN METACOGNITIVA — VIGIL by FLAVELL\n## Sesión de Reflexión Guiada\n\n---\n\n`;
            report += `## 📋 Información de la Sesión\n\n`;
            report += `| Campo | Valor |\n|-------|-------|\n`;
            report += `| **Estudiante** | ${state.userName} |\n`;
            report += `| **Email** | ${state.userEmail} |\n`;
            report += `| **Session ID** | \`${state.sessionId}\` |\n`;
            report += `| **Fecha** | ${timestamp} |\n`;
            report += `| **Duración** | ${minutes}m ${seconds}s |\n\n---\n\n`;

            if (profile) {
                report += `## 📈 Análisis Estadístico de la Sesión\n\n`;
                report += `| Métrica | Valor |\n|---------|-------|\n`;
                report += `| **Índice de Metacognición** | ${profile.metacognitionIndex}/100 |\n`;
                report += `| **Complejidad Promedio** | ${profile.avgComplexity}/100 |\n`;
                report += `| **Abstracción Promedio** | ${profile.avgAbstraction}/100 |\n`;
                report += `| **Autorregulación Promedio** | ${profile.avgSelfRegulation}/100 |\n`;
                report += `| **Ubicación de Proceso Promedio** | ${profile.avgProcessLocation}/100 |\n`;
                report += `| **Tendencia Complejidad** | ${profile.complexityTrend > 0 ? '↑' : '↓'} ${profile.complexityTrend} |\n`;
                report += `| **Tendencia Abstracción** | ${profile.abstractionTrend > 0 ? '↑' : '↓'} ${profile.abstractionTrend} |\n`;
                report += `| **Latencia Promedio** | ${profile.avgLatencia}ms |\n`;
                report += `| **Palabras Promedio** | ${profile.avgPalabras} |\n\n---\n\n`;
            }

            report += `## 💬 Diálogo por Turnos\n\n### Turno 1: Apertura\n**Vigil**: "${VIGIL.apertura}"\n\n`;

            state.respuestas.forEach((respuesta, idx) => {
                const turno   = idx + 2;
                const m       = state.metrics[turno] || {};
                report += `### Turno ${turno}\n\n`;
                report += `**Estudiante**: "${respuesta}"\n\n`;
                report += `**Métricas**:\n`;
                report += `- Latencia: ${m.latencia || '-'}ms\n`;
                report += `- Palabras: ${m.numPalabras || '-'}\n`;
                report += `- Elaboración: ${m.elaboracion || '-'}\n`;
                report += `- Complejidad: ${m.complexityScore || '-'}/100\n`;
                report += `- Abstracción: ${m.abstractionScore || '-'}/100\n`;
                report += `- Autorregulación: ${m.selfRegulationScore || '-'}/100\n`;
                report += `- Ubicación de proceso: ${m.processLocationScore || '-'}/100\n\n---\n\n`;
            });

            report += `## 🔍 Indicadores Detectados\n\n`;
            report += state.indicators.length > 0
                ? state.indicators.map(i => `- ${i}`).join('\n')
                : '- Ninguno';
            report += `\n\n- **Fase Alcanzada**: ${state.fase} — ${faseLabels[state.fase]}\n`;
            report += `- **Total Respuestas**: ${state.respuestas.length}\n`;

            return BOM + report;
        }

        function downloadSessionReport() {
            const report = generateSessionReport();
            const blob   = new Blob([report], { type: 'text/markdown; charset=utf-8' });
            const url    = URL.createObjectURL(blob);
            const link   = document.createElement('a');
            link.href     = url;
            link.download = `VIGIL-Evaluacion-${state.sessionId}.md`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }

        // =====================================================
        // UI HELPERS
        // =====================================================
        function showMiraText(text) {
            const area = document.getElementById('dialogueArea');
            area.innerHTML = '';
            const div = document.createElement('div');
            div.className = 'mira-text';
            div.textContent = text;
            area.appendChild(div);
        }

        function showStudentText(text) {
            const div = document.createElement('div');
            div.className = 'student-text';
            div.textContent = text;
            document.getElementById('dialogueArea').appendChild(div);
        }

        function showTyping() {
            const div = document.createElement('div');
            div.id = 'typingIndicator';
            div.className = 'typing-dots';
            div.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';
            document.getElementById('dialogueArea').appendChild(div);
        }

        function hideTyping()    { document.getElementById('typingIndicator')?.remove(); }
        function clearDialogue() { document.getElementById('dialogueArea').innerHTML = ''; }

        function updateStatus(text, type = '') {
            const el = document.getElementById('statusText');
            el.textContent = text;
            el.className = `status ${type === 'active' ? 'active' : type === 'error' ? 'warning' : type === 'success' ? 'success' : ''}`;
        }

        function updatePhase(phase) {
            const labels = { 1: 'Planificación', 2: 'Ejecución', 3: 'Reflexión' };
            document.getElementById('phaseIndicator').textContent = `Fase ${phase}: ${labels[phase]}`;
        }

        function updateProgress() {
            document.getElementById('progressIndicator').textContent =
                `Turnos: ${state.turno} | Respuestas: ${state.respuestas.length} | Indicadores: ${state.indicators.length}`;
        }

        function setMicState(micState) {
            const btn = document.getElementById('micButton');
            btn.className = `mic-button ${micState}`;
            btn.disabled  = micState !== 'available';
            if (micState === 'available') {
                btn.onmousedown  = startRecording;
                btn.onmouseup    = stopRecording;
                btn.ontouchstart = e => { e.preventDefault(); startRecording(); };
                btn.ontouchend   = e => { e.preventDefault(); stopRecording(); };
            }
        }

        // =====================================================
        // INIT
        // =====================================================
        window.addEventListener('DOMContentLoaded', initGoogleAuth);
        window.addEventListener('load', initGoogleAuth);
    </script>
