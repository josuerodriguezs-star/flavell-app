<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLAVELL — Evaluación Metacognitiva</title>
    <script src="https://accounts.google.com/gsi/client"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-black: #000000;
            --text-white: #ffffff;
            --text-gray: #b0b0b0;
            --text-gray-dark: #808080;
            --accent-orange: #ff9d4d;
            --status-green: #4ade80;
            --status-red: #ef4444;
            --status-gray: #6b7280;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
            background: var(--bg-black);
            color: var(--text-white);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            height: 90vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            position: relative;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.98);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            text-align: center;
        }

        .modal-title {
            font-size: 48px;
            font-weight: 700;
            margin-bottom: 16px;
            color: var(--text-white);
            letter-spacing: 2px;
        }

        .modal-subtitle {
            font-size: 18px;
            color: var(--text-gray);
            margin-bottom: 8px;
            font-weight: 400;
        }

        .modal-agent {
            font-size: 14px;
            color: var(--accent-orange);
            font-weight: 700;
            margin-bottom: 40px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .modal-recovery {
            font-size: 12px;
            color: var(--status-green);
            margin-top: 20px;
            font-weight: 500;
        }

        #google-signin-button {
            margin-top: 30px;
        }

        .recovery-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            justify-content: center;
        }

        .recovery-buttons button {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 500;
        }

        .btn-continue {
            background: var(--status-green);
            color: black;
        }

        .btn-restart {
            background: var(--status-red);
            color: white;
        }

        .header {
            text-align: center;
            width: 100%;
            padding-top: 20px;
        }

        .header-title {
            font-size: 36px;
            font-weight: 700;
            color: var(--text-white);
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .header-agent {
            font-size: 14px;
            color: var(--accent-orange);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        .header-user {
            font-size: 16px;
            color: var(--text-gray);
            margin-top: 4px;
            font-weight: 400;
        }

        .header-phase {
            font-size: 12px;
            color: var(--text-gray-dark);
            margin-top: 8px;
            font-style: italic;
            font-weight: 300;
        }

        .header-progress {
            font-size: 11px;
            color: var(--text-gray-dark);
            margin-top: 8px;
            font-weight: 300;
        }

        .dialogue-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 30px 20px;
            gap: 20px;
            min-height: 300px;
        }

        .mira-text {
            font-size: 20px;
            line-height: 1.8;
            color: var(--text-white);
            text-align: center;
            max-width: 95%;
            font-weight: 400;
            letter-spacing: 0.5px;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .student-text {
            font-size: 18px;
            line-height: 1.7;
            color: var(--text-gray);
            text-align: center;
            max-width: 95%;
            font-weight: 400;
            letter-spacing: 0.4px;
            animation: fadeOut 6s ease-in-out forwards;
            margin-top: 20px;
        }

        @keyframes fadeOut {
            0% { opacity: 1; }
            85% { opacity: 1; }
            100% { opacity: 0; }
        }

        .typing-dots {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-top: 20px;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            background: var(--accent-orange);
            border-radius: 50%;
            animation: typingBounce 1.4s infinite;
        }

        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typingBounce {
            0%, 60%, 100% { opacity: 0.4; transform: translateY(0); }
            30% { opacity: 1; transform: translateY(-10px); }
        }

        .control-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            width: 100%;
            padding-bottom: 20px;
        }

        .mic-button {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            border: none;
            background: var(--status-green);
            color: white;
            font-size: 64px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 12px 48px rgba(74, 222, 128, 0.4);
            font-weight: bold;
        }

        .mic-button.available {
            background: var(--status-green);
            cursor: pointer;
        }

        .mic-button.available:hover {
            transform: scale(1.1);
        }

        .mic-button.recording {
            background: var(--status-red);
            animation: pulse-record 0.8s infinite;
            cursor: default;
        }

        .mic-button.speaking {
            background: var(--status-gray);
            cursor: not-allowed;
            opacity: 0.6;
        }

        .mic-button.processing {
            background: var(--status-gray);
            cursor: not-allowed;
        }

        .mic-button.closed {
            background: var(--status-red);
            cursor: not-allowed;
            opacity: 0.4;
        }

        @keyframes pulse-record {
            0%, 100% { 
                box-shadow: 0 0 30px rgba(239, 68, 68, 0.5);
                transform: scale(1);
            }
            50% { 
                box-shadow: 0 0 60px rgba(239, 68, 68, 0.9);
                transform: scale(1.03);
            }
        }

        .status {
            font-size: 14px;
            color: var(--text-gray);
            text-align: center;
            min-height: 20px;
            letter-spacing: 0.5px;
            font-weight: 400;
        }

        .status.active {
            color: var(--accent-orange);
            font-weight: 600;
        }

        .status.warning {
            color: var(--status-red);
            font-weight: 700;
        }

        .status.success {
            color: var(--status-green);
            font-weight: 600;
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 600px) {
            .mic-button { 
                width: 120px; 
                height: 120px; 
                font-size: 56px;
            }
        }
    </style>
</head>
<body>

    <div class="modal active" id="loginModal">
        <div class="modal-content">
            <div class="modal-title">FLAVELL</div>
            <div class="modal-subtitle">Evaluación Metacognitiva</div>
            <div class="modal-agent">Anáhuac Online</div>
            <div id="recoveryMessage" class="modal-recovery hidden"></div>
            <div id="recoveryButtons" class="recovery-buttons hidden"></div>
            <div id="google-signin-button"></div>
        </div>
    </div>

    <div class="container hidden" id="appContainer">
        <div class="header">
            <div class="header-title">FLAVELL</div>
            <div class="header-agent">Anáhuac Online</div>
            <div class="header-user" id="userGreeting">Hola</div>
            <div class="header-phase" id="phaseIndicator">Conectando...</div>
            <div class="header-progress" id="progressIndicator"></div>
        </div>

        <div class="dialogue-area" id="dialogueArea"></div>

        <div class="control-area">
            <button class="mic-button available" id="micButton">🎤</button>
            <div class="status" id="statusText">Presiona para hablar</div>
        </div>
    </div>

    <script>
        console.log('╔════════════════════════════════════════╗');
        console.log('║  FLAVELL MIRA v12 - FINAL COMPLETE     ║');
        console.log('║  Anáhuac Online                        ║');
        console.log('╚════════════════════════════════════════╝');
        
        const CONFIG = {
            GOOGLE_CLIENT_ID: '1024048650335-et8uu1tgifepgbbfdh6hr7md1bb1hf7q.apps.googleusercontent.com',
            SHEETS_WEBHOOK: 'https://script.google.com/macros/s/AKfycbx6P0s2eAtYdFGBuGbDJZyzr4GTHq2k-6a-FkdbRgzBsffjQ1hx4pYfCmLNh7a7OBhC/exec?token=flavell-mira-token-2024',
            MAX_TURNS: 12,
            MIN_RESPONSES_TO_CLOSE: 4,
            MIN_INDICATORS_TO_CLOSE: 2,
            TTS_TIMEOUT: 8000,
            API: {
                WHISPER: '/api/whisper',
                GPT: '/api/gpt',
                TTS: '/api/tts'
            }
        };

        const state = {
            userId: null,
            userName: null,
            userEmail: null,
            sessionId: null,
            turno: 0,
            fase: 1,
            isRecording: false,
            isSpeaking: false,
            mediaRecorder: null,
            audioChunks: [],
            sessionClosed: false,
            respuestas: [],
            startTime: null,
            indicators: [],
            lastActivityTime: null,
            lastTurnoTime: null,
            metrics: {}
        };

        // ===== ELIA'S MIRA LOGIC =====
        const MIRA = {
            apertura: "Hola, soy Mira. Cuéntame, ¿en qué estás trabajando ahorita? No importa si es una tarea, algo que leíste, algo que no te quedó claro, o algo que ya terminaste. Lo que sea.",
            
            preguntas: {
                1: [
                    "¿Qué entendiste que te estaban pidiendo hacer?",
                    "¿Qué sabes ya sobre el tema antes de empezar?",
                    "¿Por dónde crees que vas a arrancar?"
                ],
                2: [
                    "¿Qué parte te está costando más trabajo?",
                    "¿En algún momento paraste a checar si ibas bien?",
                    "¿Hubo algo que no salió como esperabas?"
                ],
                3: [
                    "¿Qué aprendiste hoy, con tus propias palabras?",
                    "¿Te fue mejor o peor de lo que esperabas? ¿A qué le atribuyes eso?",
                    "¿Qué parte sí entendiste bien y cuál se quedó en el aire?"
                ]
            },

            cierres: {
                exitoso: "Creo que llegaste a algo importante hoy. Guárdalo en algún lugar, porque ese tipo de cosas se olvidan rápido. Hasta la próxima.",
                incompleto: "Quedamos a medias, pero el proceso ya empezó. Sigue pensando en eso cuando puedas.",
                frustrado: "Está bien si hoy no salió. Hay sesiones así. Vuelve cuando tengas más energía para esto."
            }
        };

        // ===== PERSISTENCIA =====
        function saveSessionState() {
            const sessionData = {
                userId: state.userId,
                userName: state.userName,
                userEmail: state.userEmail,
                sessionId: state.sessionId,
                turno: state.turno,
                fase: state.fase,
                respuestas: state.respuestas,
                indicators: state.indicators,
                startTime: state.startTime,
                metrics: state.metrics,
                timestamp: Date.now()
            };
            localStorage.setItem(`flavell-session-${state.sessionId}`, JSON.stringify(sessionData));
            console.log('💾 Sesión guardada:', state.sessionId);
        }

        function checkSessionRecovery(userId) {
            console.log('🔍 Buscando sesiones incompletas para:', userId);
            
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key.startsWith('flavell-session-')) {
                    const data = JSON.parse(localStorage.getItem(key));
                    
                    if (data.userId === userId && !data.sessionClosed && data.turno > 1) {
                        const noExpiro = (Date.now() - data.timestamp) < 7200000;
                        if (noExpiro) {
                            console.log('✓ RECUPERABLE:', key);
                            return data;
                        }
                    }
                }
            }
            
            console.log('❌ No hay sesiones recuperables');
            return null;
        }

        function initGoogleAuth() {
            console.log('🔐 Inicializando Google Auth...');
            
            if (typeof google === 'undefined' || !google.accounts) {
                console.warn('⏳ Google aún no carga, reintentando en 500ms...');
                setTimeout(initGoogleAuth, 500);
                return;
            }

            try {
                google.accounts.id.initialize({
                    client_id: CONFIG.GOOGLE_CLIENT_ID,
                    callback: handleGoogleLogin
                });
                
                console.log('✅ Google inicializado');
                
                const button = document.getElementById('google-signin-button');
                if (!button) {
                    console.error('❌ Elemento #google-signin-button no encontrado');
                    return;
                }
                
                google.accounts.id.renderButton(button, {
                    theme: 'outline',
                    size: 'large',
                    text: 'signin_with'
                });
                
                console.log('✅ Botón renderizado');
            } catch (error) {
                console.error('❌ Error en Google Auth:', error);
            }
        }

        function handleGoogleLogin(response) {
            console.log('🔓 Usuario intentando login...');
            try {
                const base64Url = response.credential.split('.')[1];
                const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                const jsonPayload = decodeURIComponent(
                    atob(base64).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join('')
                );
                const userData = JSON.parse(jsonPayload);
                state.userId = userData.sub;
                state.userName = userData.name;
                state.userEmail = userData.email;

                console.log('✅ Login exitoso');
                console.log('   Usuario:', state.userName);
                console.log('   Email:', state.userEmail);
                console.log('   ID:', state.userId);

                const recoveredSession = checkSessionRecovery(state.userId);
                
                if (recoveredSession && recoveredSession.turno > 1) {
                    showRecoveryOption(recoveredSession);
                } else {
                    startNewSession();
                }
            } catch (error) {
                console.error('❌ Error en login:', error);
            }
        }

        function showRecoveryOption(recoveredSession) {
            const msg = document.getElementById('recoveryMessage');
            msg.textContent = `Encontramos una sesión anterior en Fase ${recoveredSession.fase} con ${recoveredSession.turno} turnos. ¿Deseas continuar?`;
            msg.classList.remove('hidden');

            const buttons = document.getElementById('recoveryButtons');
            buttons.innerHTML = `
                <button class="btn-continue" onclick="continueSession()">Continuar Sesión</button>
                <button class="btn-restart" onclick="startNewSession()">Iniciar Nueva</button>
            `;
            buttons.classList.remove('hidden');
        }

        function continueSession() {
            const recoveredSession = checkSessionRecovery(state.userId);
            if (recoveredSession) {
                state.sessionId = recoveredSession.sessionId;
                state.turno = recoveredSession.turno;
                state.fase = recoveredSession.fase;
                state.respuestas = recoveredSession.respuestas;
                state.indicators = recoveredSession.indicators;
                state.startTime = recoveredSession.startTime;
                state.metrics = recoveredSession.metrics;
                state.lastActivityTime = Date.now();

                document.getElementById('loginModal').classList.remove('active');
                document.getElementById('appContainer').classList.remove('hidden');
                document.getElementById('userGreeting').textContent = state.userName.split(' ')[0];

                logToSheet({
                    tipo: 'recuperacion',
                    texto: `Sesión recuperada en Fase ${state.fase}, turno ${state.turno}`,
                    estadoSesion: 'recuperada'
                });

                continueFromPhase();
            }
        }

        function startNewSession() {
            state.sessionId = `${state.userId}-${Date.now()}`;
            state.turno = 0;
            state.fase = 1;
            state.respuestas = [];
            state.indicators = [];
            state.startTime = Date.now();
            state.metrics = {};
            state.lastActivityTime = Date.now();

            document.getElementById('loginModal').classList.remove('active');
            document.getElementById('appContainer').classList.remove('hidden');
            document.getElementById('userGreeting').textContent = state.userName.split(' ')[0];

            startInterview();
        }

        async function startInterview() {
            state.turno = 1;
            state.fase = 1;
            state.lastTurnoTime = Date.now();
            updateStatus('Iniciando...', 'active');
            updateProgress();
            showMiraText(MIRA.apertura);
            setMicState('speaking');
            await speakText(MIRA.apertura);
            setMicState('available');
            updateStatus('Presiona para hablar', 'active');

            logToSheet({
                turno: state.turno,
                fase: state.fase,
                speaker: 'mira',
                tipo: 'apertura',
                texto: MIRA.apertura,
                latencia: 0,
                elaboracion: 'N/A'
            });

            saveSessionState();
        }

        async function continueFromPhase() {
            updateStatus('Sesión recuperada', 'success');
            updateProgress();
            
            const labels = { 1: 'Planificación', 2: 'Ejecución', 3: 'Reflexión' };
            showMiraText(`Retomamos donde nos quedamos. Estamos en Fase ${state.fase}: ${labels[state.fase]}. Adelante.`);
            setMicState('speaking');
            await speakText(`Retomamos donde nos quedamos. Estamos en Fase ${state.fase}. Adelante.`);
            
            state.turno++;
            await askNextQuestion();
        }

        function detectPhase(text) {
            const lower = text.toLowerCase();
            if (/terminé|acabé|finalizé|completé|aprendí|descubrí|entendí|me di cuenta|resultó|funcionó|no funcionó|conclusión|resultado|logré|conseguí|dominé|comprendí|asimilé|reflexiono|pensé|analice|evalúe|consideré|mejoraría|cambiaría|siguiente vez|próxima|error|equivocación|reto|desafío/.test(lower)) 
                return 3;
            if (/empecé|estoy|hice|haciendo|leyendo|escribiendo|resolviendo|calculando|analizando|buscando|investigando|encontré|revisando|checando|probando|intentando|aplicando|usando|ejecutando|realizando|desarrollando|construyendo|creando|practique|trabaje|intente|realice|desarrollo|construyo|cree/.test(lower)) 
                return 2;
            return 1;
        }

        function detectIndicators(text) {
            const lower = text.toLowerCase();
            const detected = [];

            if (/decidí|elegí|cambié mi estrategia|me di cuenta|aprendí|entendí|logré|conseguí|hice diferente|fue porque|decidí que|cambié de|mejoré mi/.test(lower)) {
                detected.push('atribución_interna');
            }

            if (/próxima vez|siguiente|haría diferente|cambiaría|mejoraría|si lo repito|para la próxima|específicamente|primero|después/.test(lower)) {
                detected.push('inferencia_adaptativa');
            }

            if (text.length > 50 && text.split(' ').length > 10) {
                detected.push('síntesis_propia');
            }

            if (/entendí bien|no me quedó clara|en la parte de|pero todavía|claramente|específicamente|esto sí|esto no/.test(lower)) {
                detected.push('bordes_precisos');
            }

            return detected;
        }

        function classifyElaboration(text) {
            const length = text.length;
            const words = text.split(' ').length;
            
            if (length < 20 || words < 3) return 'breve';
            if (length < 100 || words < 15) return 'moderada';
            return 'elaborada';
        }

        function shouldClose() {
            if (state.respuestas.length < CONFIG.MIN_RESPONSES_TO_CLOSE) return false;
            return state.indicators.length >= CONFIG.MIN_INDICATORS_TO_CLOSE;
        }

        async function startRecording() {
            if (state.sessionClosed || state.isSpeaking) return;
            try {
                state.lastTurnoTime = Date.now();
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                state.mediaRecorder = new MediaRecorder(stream);
                state.audioChunks = [];
                state.mediaRecorder.ondataavailable = (event) => {
                    state.audioChunks.push(event.data);
                };
                state.mediaRecorder.onstop = async () => {
                    await processAudio();
                };
                state.mediaRecorder.start();
                state.isRecording = true;
                setMicState('recording');
                updateStatus('Hablando...', 'active');
            } catch (error) {
                console.error('Mic error:', error);
                updateStatus('Error micrófono', 'error');
            }
        }

        function stopRecording() {
            if (state.mediaRecorder && state.isRecording) {
                state.mediaRecorder.stop();
                state.isRecording = false;
                setMicState('processing');
                updateStatus('Procesando...', 'active');
            }
        }

        async function processAudio() {
            try {
                const audioBlob = new Blob(state.audioChunks, { type: 'audio/webm' });
                const reader = new FileReader();
                reader.onload = async () => {
                    try {
                        const audioBase64 = reader.result.split(',')[1];
                        
                        const transcriptResponse = await fetch(CONFIG.API.WHISPER, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ audio: audioBase64 })
                        });

                        if (!transcriptResponse.ok) {
                            throw new Error(`Whisper error: ${transcriptResponse.status}`);
                        }

                        const transcriptData = await transcriptResponse.json();
                        const userText = transcriptData.text || '';

                        if (!userText.trim() || userText.length < 3) {
                            updateStatus('No se capturó audio. Intenta de nuevo.', 'error');
                            setMicState('available');
                            return;
                        }

                        // CALCULAR MÉTRICAS
                        const latencia = Date.now() - state.lastTurnoTime;
                        const longitud = userText.length;
                        const numPalabras = userText.split(' ').length;
                        const elaboracion = classifyElaboration(userText);

                        state.metrics[state.turno] = {
                            latencia,
                            longitud,
                            numPalabras,
                            elaboracion
                        };

                        console.log(`📊 Turno ${state.turno} - Métricas:`, state.metrics[state.turno]);

                        // Log respuesta
                        showStudentText(userText);
                        state.respuestas.push(userText);
                        logToSheet({
                            turno: state.turno,
                            fase: state.fase,
                            speaker: 'student',
                            tipo: 'respuesta',
                            texto: userText,
                            latencia: latencia,
                            longitudRespuesta: longitud,
                            numPalabras: numPalabras,
                            elaboracion: elaboracion
                        });

                        // Detectar fase
                        const newPhase = detectPhase(userText);
                        if (newPhase !== state.fase) {
                            state.fase = newPhase;
                            updatePhase(newPhase);
                        }

                        // Detectar indicadores
                        const newIndicators = detectIndicators(userText);
                        state.indicators.push(...newIndicators);

                        state.turno++;
                        state.lastActivityTime = Date.now();
                        updateProgress();
                        saveSessionState();

                        if (shouldClose() || state.turno > CONFIG.MAX_TURNS) {
                            await closeSession();
                            return;
                        }

                        await askNextQuestion();

                    } catch (error) {
                        console.error('Processing error:', error);
                        updateStatus('Error procesando', 'error');
                        setMicState('available');
                    }
                };
                reader.readAsDataURL(audioBlob);
            } catch (error) {
                console.error('Audio error:', error);
                updateStatus('Error de audio', 'error');
                setMicState('available');
            }
        }

        async function askNextQuestion() {
            updateStatus('Mira reflexiona...', 'active');
            showTyping();
            setMicState('processing');

            try {
                const preguntasPhase = MIRA.preguntas[state.fase];
                const preguntaIdx = (state.turno - 2) % preguntasPhase.length;
                const nextQuestion = preguntasPhase[preguntaIdx];

                hideTyping();
                clearDialogue();
                showMiraText(nextQuestion);
                setMicState('speaking');
                await speakText(nextQuestion);

                logToSheet({
                    turno: state.turno,
                    fase: state.fase,
                    speaker: 'mira',
                    tipo: 'pregunta',
                    texto: nextQuestion,
                    latencia: 0,
                    elaboracion: 'N/A'
                });

                setMicState('available');
                updateStatus('Presiona para hablar', 'active');
                saveSessionState();

            } catch (error) {
                console.error('Question error:', error);
                updateStatus('Error', 'error');
                setMicState('available');
            }
        }

        async function closeSession() {
            state.sessionClosed = true;
            setMicState('closed');

            let closeMessage = MIRA.cierres.exitoso;
            if (state.indicators.length === 0) {
                closeMessage = MIRA.cierres.frustrado;
            } else if (state.indicators.length === 1) {
                closeMessage = MIRA.cierres.incompleto;
            }

            clearDialogue();
            showMiraText(closeMessage);
            setMicState('speaking');
            updateStatus('Sesión completada ✓', 'success');
            await speakText(closeMessage);

            try {
                await logToSheet({
                    turno: state.turno,
                    fase: state.fase,
                    speaker: 'mira',
                    tipo: 'cierre',
                    texto: closeMessage,
                    indicadoresDetectados: state.indicators.join('|'),
                    estadoSesion: 'completada'
                });
                console.log('✅ Sesión cerrada registrada');
            } catch (error) {
                console.error('❌ Error registrando cierre:', error);
            }

            localStorage.removeItem(`flavell-session-${state.sessionId}`);
            saveSessionState();

            setTimeout(() => {
                downloadSessionReport();
            }, 1000);
        }

        async function speakText(text) {
            state.isSpeaking = true;
            try {
                const response = await fetch(CONFIG.API.TTS, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text })
                });

                const data = await response.json();
                if (!response.ok) throw new Error(data.error);

                const audioUrl = `data:audio/mp3;base64,${data.audio}`;
                const audio = new Audio(audioUrl);

                return new Promise((resolve) => {
                    const timeout = setTimeout(() => {
                        state.isSpeaking = false;
                        resolve();
                    }, CONFIG.TTS_TIMEOUT);

                    audio.onended = () => {
                        clearTimeout(timeout);
                        state.isSpeaking = false;
                        resolve();
                    };

                    audio.onerror = () => {
                        clearTimeout(timeout);
                        state.isSpeaking = false;
                        resolve();
                    };

                    audio.play().catch(() => {
                        clearTimeout(timeout);
                        state.isSpeaking = false;
                        resolve();
                    });
                });

            } catch (error) {
                console.error('TTS error:', error);
                state.isSpeaking = false;
            }
        }

        async function logToSheet(data) {
            try {
                const payload = {
                    userId: state.userId,
                    sessionId: state.sessionId,
                    userEmail: state.userEmail,
                    userName: state.userName,
                    turno: data.turno,
                    fase: data.fase,
                    speaker: data.speaker,
                    tipo: data.tipo,
                    texto: data.texto || '',
                    latencia: data.latencia || '',
                    longitudRespuesta: data.longitudRespuesta || '',
                    numPalabras: data.numPalabras || '',
                    elaboracion: data.elaboracion || '',
                    indicadoresDetectados: data.indicadoresDetectados || '',
                    estadoSesion: data.estadoSesion || 'en_progreso'
                };

                console.log('📤 Enviando a sheet:', payload);

                await fetch(CONFIG.SHEETS_WEBHOOK, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: JSON.stringify(payload)
                });

                console.log('✅ Registrado en sheet');
            } catch (error) {
                console.error('Log error:', error);
            }
        }

        function generateSessionReport() {
            const BOM = '\uFEFF';
            const faseLabels = { 1: 'Planificación', 2: 'Ejecución', 3: 'Reflexión' };
            const timestamp = new Date().toLocaleString('es-MX');
            const duration = Math.round((Date.now() - state.startTime) / 1000);
            const minutes = Math.floor(duration / 60);
            const seconds = duration % 60;

            let report = `# EVALUACIÓN METACOGNITIVA - FLAVELL\n## Sesión de Reflexión Guiada\n\n---\n\n## 📋 Información de la Sesión\n\n| Campo | Valor |\n|-------|-------|\n| **Estudiante** | ${state.userName} |\n| **Email** | ${state.userEmail} |\n| **User ID** | \`${state.userId}\` |\n| **Session ID** | \`${state.sessionId}\` |\n| **Fecha** | ${timestamp} |\n| **Duración** | ${minutes}m ${seconds}s |\n\n---\n\n## 💬 Diálogo Completo por Turnos\n\n### Turno 1: Apertura\n**Mira**: "${MIRA.apertura}"\n\n`;

            state.respuestas.forEach((respuesta, indice) => {
                const turno = indice + 2;
                const preguntasPhase = MIRA.preguntas[state.fase] || MIRA.preguntas[1];
                const preguntaIdx = (turno - 2) % preguntasPhase.length;
                const pregunta = preguntasPhase[preguntaIdx];
                
                const metrics = state.metrics[turno] || {};
                const latencia = metrics.latencia ? `${metrics.latencia}ms` : '-';
                const longitud = metrics.longitud || '-';
                const numPalabras = metrics.numPalabras || '-';
                const elaboracion = metrics.elaboracion || '-';

                report += `### Turno ${turno}\n\n**Mira**: "${pregunta}"\n\n**Estudiante**: "${respuesta}"\n\n**Métricas**:\n- Latencia: ${latencia}\n- Longitud: ${longitud} caracteres\n- Palabras: ${numPalabras}\n- Elaboración: ${elaboracion}\n\n---\n\n`;
            });

            report += `## 🔍 Análisis\n\n- **Fase Alcanzada**: ${state.fase} - ${faseLabels[state.fase]}\n- **Indicadores**: ${state.indicators.length > 0 ? state.indicators.join(', ') : 'Ninguno'}\n- **Respuestas**: ${state.respuestas.length}\n\n`;

            return BOM + report;
        }

        function downloadSessionReport() {
            const report = generateSessionReport();
            const blob = new Blob([report], { type: 'text/markdown; charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `FLAVELL-Evaluacion-${state.sessionId}.md`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
            console.log('📥 Reporte descargado:', link.download);
        }

        function showMiraText(text) {
            const dialogue = document.getElementById('dialogueArea');
            dialogue.innerHTML = '';
            const div = document.createElement('div');
            div.className = 'mira-text';
            div.textContent = text;
            dialogue.appendChild(div);
        }

        function showStudentText(text) {
            const dialogue = document.getElementById('dialogueArea');
            const div = document.createElement('div');
            div.className = 'student-text';
            div.textContent = text;
            dialogue.appendChild(div);
        }

        function showTyping() {
            const dialogue = document.getElementById('dialogueArea');
            const div = document.createElement('div');
            div.id = 'typingIndicator';
            div.className = 'typing-dots';
            div.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';
            dialogue.appendChild(div);
        }

        function hideTyping() {
            document.getElementById('typingIndicator')?.remove();
        }

        function clearDialogue() {
            document.getElementById('dialogueArea').innerHTML = '';
        }

        function updateStatus(text, type = '') {
            const el = document.getElementById('statusText');
            el.textContent = text;
            el.className = `status ${type === 'active' ? 'active' : type === 'error' ? 'warning' : type === 'success' ? 'success' : ''}`;
        }

        function updatePhase(phase) {
            const labels = { 1: 'Planificación', 2: 'Ejecución', 3: 'Reflexión' };
            document.getElementById('phaseIndicator').textContent = `Fase ${phase}: ${labels[phase]}`;
        }

        function updateProgress() {
            const el = document.getElementById('progressIndicator');
            el.textContent = `Turnos: ${state.turno} | Respuestas: ${state.respuestas.length} | Indicadores: ${state.indicators.length}`;
        }

        function setMicState(micState) {
            const btn = document.getElementById('micButton');
            btn.className = `mic-button ${micState}`;
            btn.disabled = micState !== 'available';

            if (micState === 'available') {
                btn.onmousedown = startRecording;
                btn.onmouseup = stopRecording;
                btn.ontouchstart = (e) => { e.preventDefault(); startRecording(); };
                btn.ontouchend = (e) => { e.preventDefault(); stopRecording(); };
            }
        }

        // Esperar a que el DOM esté listo
        window.addEventListener('DOMContentLoaded', () => {
            console.log('📄 DOM listo');
            initGoogleAuth();
        });

        // También intentar cuando toda la página cargue
        window.addEventListener('load', () => {
            console.log('🚀 Página completamente cargada');
            initGoogleAuth();
        });
    </script>

</body>
