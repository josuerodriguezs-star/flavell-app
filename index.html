<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLAVELL — Mira</title>
    <script src="https://accounts.google.com/gsi/client"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-black: #000000;
            --text-white: #ffffff;
            --text-gray: #b0b0b0;
            --text-gray-dark: #808080;
            --accent-orange: #ff9d4d;
            --status-green: #4ade80;
            --status-red: #ef4444;
            --status-gray: #6b7280;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
            background: var(--bg-black);
            color: var(--text-white);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            height: 90vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            position: relative;
        }

        /* MODAL LOGIN */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.98);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            text-align: center;
        }

        .modal-title {
            font-size: 48px;
            font-weight: 700;
            margin-bottom: 16px;
            color: var(--text-white);
            letter-spacing: 2px;
        }

        .modal-subtitle {
            font-size: 18px;
            color: var(--text-gray);
            margin-bottom: 8px;
            font-weight: 400;
        }

        .modal-agent {
            font-size: 14px;
            color: var(--accent-orange);
            font-weight: 700;
            margin-bottom: 40px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        #google-signin-button {
            margin-top: 30px;
        }

        /* HEADER */
        .header {
            text-align: center;
            width: 100%;
            padding-top: 20px;
        }

        .header-title {
            font-size: 36px;
            font-weight: 700;
            color: var(--text-white);
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .header-agent {
            font-size: 14px;
            color: var(--accent-orange);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        .header-user {
            font-size: 16px;
            color: var(--text-gray);
            margin-top: 4px;
            font-weight: 400;
        }

        .header-phase {
            font-size: 12px;
            color: var(--text-gray-dark);
            margin-top: 8px;
            font-style: italic;
            font-weight: 300;
        }

        .header-progress {
            font-size: 11px;
            color: var(--text-gray-dark);
            margin-top: 8px;
            font-weight: 300;
        }

        /* DIALOGUE AREA */
        .dialogue-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 30px 20px;
            gap: 20px;
            min-height: 300px;
        }

        .mira-text {
            font-size: 20px;
            line-height: 1.8;
            color: var(--text-white);
            text-align: center;
            max-width: 95%;
            font-weight: 400;
            letter-spacing: 0.5px;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .student-text {
            font-size: 18px;
            line-height: 1.7;
            color: var(--text-gray);
            text-align: center;
            max-width: 95%;
            font-weight: 400;
            letter-spacing: 0.4px;
            animation: fadeOut 6s ease-in-out forwards;
            margin-top: 20px;
        }

        @keyframes fadeOut {
            0% { opacity: 1; }
            85% { opacity: 1; }
            100% { opacity: 0; }
        }

        .typing-dots {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-top: 20px;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            background: var(--accent-orange);
            border-radius: 50%;
            animation: typingBounce 1.4s infinite;
        }

        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typingBounce {
            0%, 60%, 100% { opacity: 0.4; transform: translateY(0); }
            30% { opacity: 1; transform: translateY(-10px); }
        }

        /* CONTROL AREA */
        .control-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            width: 100%;
            padding-bottom: 20px;
        }

        .mic-button {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            border: none;
            background: var(--status-green);
            color: white;
            font-size: 64px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 12px 48px rgba(74, 222, 128, 0.4);
            font-weight: bold;
        }

        .mic-button.available {
            background: var(--status-green);
            box-shadow: 0 12px 48px rgba(74, 222, 128, 0.4);
            cursor: pointer;
        }

        .mic-button.available:hover {
            transform: scale(1.1);
            box-shadow: 0 16px 64px rgba(74, 222, 128, 0.6);
        }

        .mic-button.recording {
            background: var(--status-red);
            box-shadow: 0 0 40px rgba(239, 68, 68, 0.7);
            animation: pulse-record 0.8s infinite;
            cursor: default;
        }

        .mic-button.speaking {
            background: var(--status-gray);
            box-shadow: 0 12px 48px rgba(107, 114, 128, 0.3);
            cursor: not-allowed;
            opacity: 0.6;
        }

        .mic-button.processing {
            background: var(--status-gray);
            box-shadow: 0 12px 48px rgba(107, 114, 128, 0.3);
            cursor: not-allowed;
        }

        .mic-button.closed {
            background: var(--status-red);
            cursor: not-allowed;
            opacity: 0.4;
        }

        @keyframes pulse-record {
            0%, 100% { 
                box-shadow: 0 0 30px rgba(239, 68, 68, 0.5);
                transform: scale(1);
            }
            50% { 
                box-shadow: 0 0 60px rgba(239, 68, 68, 0.9);
                transform: scale(1.03);
            }
        }

        .status {
            font-size: 14px;
            color: var(--text-gray);
            text-align: center;
            min-height: 20px;
            letter-spacing: 0.5px;
            font-weight: 400;
        }

        .status.active {
            color: var(--accent-orange);
            font-weight: 600;
        }

        .status.warning {
            color: var(--status-red);
            font-weight: 700;
        }

        .status.success {
            color: var(--status-green);
            font-weight: 600;
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 600px) {
            .mic-button { 
                width: 120px; 
                height: 120px; 
                font-size: 56px;
            }
            .mira-text {
                font-size: 18px;
            }
            .student-text {
                font-size: 16px;
            }
            .header-title {
                font-size: 32px;
            }
        }
    </style>
</head>
<body>

    <div class="modal active" id="loginModal">
        <div class="modal-content">
            <div class="modal-title">FLAVELL</div>
            <div class="modal-subtitle">Evaluación Metacognitiva</div>
            <div class="modal-agent">Powered by Mira</div>
            <div id="google-signin-button"></div>
        </div>
    </div>

    <div class="container hidden" id="appContainer">
        <div class="header">
            <div class="header-title">FLAVELL</div>
            <div class="header-agent">Mira</div>
            <div class="header-user" id="userGreeting">Hola</div>
            <div class="header-phase" id="phaseIndicator">Conectando...</div>
            <div class="header-progress" id="progressIndicator"></div>
        </div>

        <div class="dialogue-area" id="dialogueArea"></div>

        <div class="control-area">
            <button class="mic-button available" id="micButton">🎤</button>
            <div class="status" id="statusText">Presiona para hablar</div>
        </div>
    </div>

    <script>
        const CONFIG = {
            GOOGLE_CLIENT_ID: '1024048650335-et8uu1tgifepgbbfdh6hr7md1bb1hf7q.apps.googleusercontent.com',
            SHEETS_WEBHOOK: 'https://script.google.com/macros/s/AKfycby.../exec?token=flavell-mira-token-2024',
            MAX_TURNS: 12,
            MIN_RESPONSES_TO_CLOSE: 4,
            MIN_INDICATORS_TO_CLOSE: 2,
            TTS_TIMEOUT: 8000,
            API: {
                WHISPER: '/api/whisper',
                GPT: '/api/gpt',
                TTS: '/api/tts'
            }
        };

        const state = {
            userId: null,
            userName: null,
            userEmail: null,
            sessionId: null,
            turno: 0,
            fase: 1,
            isRecording: false,
            isSpeaking: false,
            mediaRecorder: null,
            audioChunks: [],
            sessionClosed: false,
            respuestas: [],
            startTime: null,
            indicators: [],
            lastActivityTime: null
        };

        // ===== ELIA'S MIRA LOGIC =====
        const MIRA = {
            apertura: "Hola, soy Mira. Cuéntame, ¿en qué estás trabajando ahorita? No importa si es una tarea, algo que leíste, algo que no te quedó claro, o algo que ya terminaste. Lo que sea.",
            
            preguntas: {
                1: [
                    "¿Qué entendiste que te estaban pidiendo hacer?",
                    "¿Qué sabes ya sobre el tema antes de empezar?",
                    "¿Por dónde crees que vas a arrancar?"
                ],
                2: [
                    "¿Qué parte te está costando más trabajo?",
                    "¿En algún momento paraste a checar si ibas bien?",
                    "¿Hubo algo que no salió como esperabas?"
                ],
                3: [
                    "¿Qué aprendiste hoy, con tus propias palabras?",
                    "¿Te fue mejor o peor de lo que esperabas? ¿A qué le atribuyes eso?",
                    "¿Qué parte sí entendiste bien y cuál se quedó en el aire?"
                ]
            },

            cierres: {
                exitoso: "Creo que llegaste a algo importante hoy. Guárdalo en algún lugar, porque ese tipo de cosas se olvidan rápido. Hasta la próxima.",
                incompleto: "Quedamos a medias, pero el proceso ya empezó. Sigue pensando en eso cuando puedas.",
                frustrado: "Está bien si hoy no salió. Hay sesiones así. Vuelve cuando tengas más energía para esto."
            }
        };

        function initGoogleAuth() {
            google.accounts.id.initialize({
                client_id: CONFIG.GOOGLE_CLIENT_ID,
                callback: handleGoogleLogin
            });
            google.accounts.id.renderButton(
                document.getElementById('google-signin-button'),
                { theme: 'outline', size: 'large', text: 'signin_with' }
            );
        }

        function handleGoogleLogin(response) {
            try {
                const base64Url = response.credential.split('.')[1];
                const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                const jsonPayload = decodeURIComponent(
                    atob(base64).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join('')
                );
                const userData = JSON.parse(jsonPayload);
                state.userId = userData.sub;
                state.userName = userData.name;
                state.userEmail = userData.email;
                state.sessionId = `${state.userId}-${Date.now()}`;
                state.startTime = Date.now();
                state.lastActivityTime = Date.now();

                document.getElementById('loginModal').classList.remove('active');
                document.getElementById('appContainer').classList.remove('hidden');
                document.getElementById('userGreeting').textContent = state.userName.split(' ')[0];

                startInterview();
            } catch (error) {
                console.error('Auth error:', error);
            }
        }

        async function startInterview() {
            state.turno = 1;
            state.fase = 1;
            updateStatus('Iniciando...', 'active');
            updateProgress();
            showMiraText(MIRA.apertura);
            setMicState('speaking');
            await speakText(MIRA.apertura);
            setMicState('available');
            updateStatus('Presiona para hablar', 'active');

            logToSheet({
                turno: state.turno,
                fase: state.fase,
                speaker: 'mira',
                tipo: 'apertura',
                texto: MIRA.apertura
            });
        }

        function detectPhase(text) {
            const lower = text.toLowerCase();
            if (/terminé|acabé|finalizé|completé|aprendí|descubrí|entendí|me di cuenta|resultó|funcionó|no funcionó|conclusión|resultado|logré|conseguí|dominé|comprendí|asimilé|reflexiono|pensé|analice|evalúe|consideré|mejoraría|cambiaría|siguiente vez|próxima|error|equivocación|reto|desafío/.test(lower)) 
                return 3;
            if (/empecé|estoy|hice|haciendo|leyendo|escribiendo|resolviendo|calculando|analizando|buscando|investigando|encontré|revisando|checando|probando|intentando|aplicando|usando|ejecutando|realizando|desarrollando|construyendo|creando|practique|trabaje|intente|realice|desarrollo|construyo|cree/.test(lower)) 
                return 2;
            return 1;
        }

        function detectIndicators(text) {
            const lower = text.toLowerCase();
            const detected = [];

            // Atribución interna
            if (/decidí|elegí|cambié mi estrategia|me di cuenta|aprendí|entendí|logré|conseguí|hice diferente|fue porque|decidí que|cambié de|mejoré mi/.test(lower)) {
                detected.push('atribución_interna');
            }

            // Inferencia adaptativa
            if (/próxima vez|siguiente|haría diferente|cambiaría|mejoraría|si lo repito|para la próxima|específicamente|primero|después/.test(lower)) {
                detected.push('inferencia_adaptativa');
            }

            // Síntesis propia
            if (text.length > 50 && text.split(' ').length > 10) {
                detected.push('síntesis_propia');
            }

            // Bordes precisos
            if (/entendí bien|no me quedó clara|en la parte de|pero todavía|claramente|específicamente|esto sí|esto no/.test(lower)) {
                detected.push('bordes_precisos');
            }

            return detected;
        }

        function shouldClose() {
            if (state.respuestas.length < CONFIG.MIN_RESPONSES_TO_CLOSE) return false;
            return state.indicators.length >= CONFIG.MIN_INDICATORS_TO_CLOSE;
        }

        async function startRecording() {
            if (state.sessionClosed || state.isSpeaking) return;
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                state.mediaRecorder = new MediaRecorder(stream);
                state.audioChunks = [];
                state.mediaRecorder.ondataavailable = (event) => {
                    state.audioChunks.push(event.data);
                };
                state.mediaRecorder.onstop = async () => {
                    await processAudio();
                };
                state.mediaRecorder.start();
                state.isRecording = true;
                setMicState('recording');
                updateStatus('Hablando...', 'active');
            } catch (error) {
                console.error('Mic error:', error);
                updateStatus('Error micrófono', 'error');
            }
        }

        function stopRecording() {
            if (state.mediaRecorder && state.isRecording) {
                state.mediaRecorder.stop();
                state.isRecording = false;
                setMicState('processing');
                updateStatus('Procesando...', 'active');
            }
        }

        async function processAudio() {
            try {
                const audioBlob = new Blob(state.audioChunks, { type: 'audio/webm' });
                const reader = new FileReader();
                reader.onload = async () => {
                    try {
                        const audioBase64 = reader.result.split(',')[1];
                        const transcriptResponse = await fetch(CONFIG.API.WHISPER, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ audio: audioBase64 })
                        });

                        if (!transcriptResponse.ok) {
                            throw new Error(`Whisper error: ${transcriptResponse.status}`);
                        }

                        const transcriptData = await transcriptResponse.json();
                        const userText = transcriptData.text || '';

                        if (!userText.trim() || userText.length < 3) {
                            updateStatus('No se capturó audio. Intenta de nuevo.', 'error');
                            setMicState('available');
                            return;
                        }

                        // Log respuesta del estudiante
                        showStudentText(userText);
                        state.respuestas.push(userText);
                        logToSheet({
                            turno: state.turno,
                            fase: state.fase,
                            speaker: 'student',
                            tipo: 'respuesta',
                            texto: userText
                        });

                        // Detectar fase
                        const newPhase = detectPhase(userText);
                        if (newPhase !== state.fase) {
                            state.fase = newPhase;
                            updatePhase(newPhase);
                        }

                        // Detectar indicadores
                        const newIndicators = detectIndicators(userText);
                        state.indicators.push(...newIndicators);

                        // Siguiente turno
                        state.turno++;
                        state.lastActivityTime = Date.now();
                        updateProgress();

                        // Verificar cierre
                        if (shouldClose() || state.turno > CONFIG.MAX_TURNS) {
                            await closeSession();
                            return;
                        }

                        // Siguiente pregunta
                        await askNextQuestion();

                    } catch (error) {
                        console.error('Processing error:', error);
                        updateStatus('Error procesando', 'error');
                        setMicState('available');
                    }
                };
                reader.readAsDataURL(audioBlob);
            } catch (error) {
                console.error('Audio error:', error);
                updateStatus('Error de audio', 'error');
                setMicState('available');
            }
        }

        async function askNextQuestion() {
            updateStatus('Mira reflexiona...', 'active');
            showTyping();
            setMicState('processing');

            try {
                // Elegir pregunta de la fase actual
                const preguntasPhase = MIRA.preguntas[state.fase];
                const preguntaIdx = (state.turno - 2) % preguntasPhase.length;
                const nextQuestion = preguntasPhase[preguntaIdx];

                hideTyping();
                clearDialogue();
                showMiraText(nextQuestion);
                setMicState('speaking');
                await speakText(nextQuestion);

                logToSheet({
                    turno: state.turno,
                    fase: state.fase,
                    speaker: 'mira',
                    tipo: 'pregunta',
                    texto: nextQuestion
                });

                setMicState('available');
                updateStatus('Presiona para hablar', 'active');

            } catch (error) {
                console.error('Question error:', error);
                updateStatus('Error', 'error');
                setMicState('available');
            }
        }

        async function closeSession() {
            state.sessionClosed = true;
            setMicState('closed');

            // Elegir cierre basado en indicadores
            let closeMessage = MIRA.cierres.exitoso;
            if (state.indicators.length === 0) {
                closeMessage = MIRA.cierres.frustrado;
            } else if (state.indicators.length === 1) {
                closeMessage = MIRA.cierres.incompleto;
            }

            clearDialogue();
            showMiraText(closeMessage);
            setMicState('speaking');
            updateStatus('Sesión completada ✓', 'success');
            await speakText(closeMessage);

            logToSheet({
                turno: state.turno,
                fase: state.fase,
                speaker: 'mira',
                tipo: 'cierre',
                texto: closeMessage,
                indicadores: state.indicators.join('|'),
                respuestasCount: state.respuestas.length
            });

            // Generar y descargar reporte
            setTimeout(() => {
                downloadSessionReport();
            }, 2000);
        }

        function generateSessionReport() {
            const faseLabels = { 1: 'Planificación', 2: 'Ejecución', 3: 'Reflexión' };
            const timestamp = new Date().toLocaleString('es-MX');
            const duration = Math.round((Date.now() - state.startTime) / 1000);
            
            const report = `═══════════════════════════════════════════════════════
EVALUACIÓN METACOGNITIVA - FLAVELL
SESIÓN DE REFLEXIÓN GUIADA
═══════════════════════════════════════════════════════

INFORMACIÓN DEL ESTUDIANTE:
Nombre: ${state.userName}
Email: ${state.userEmail}
Fecha: ${timestamp}
Duración: ${duration} segundos
Sesión ID: ${state.sessionId}

─────────────────────────────────────────────────────

RESULTADOS DE LA SESIÓN:

Fase inicial: 1 - Planificación
Fase final: ${state.fase} - ${faseLabels[state.fase]}
Total de turnos: ${state.turno}
Respuestas completadas: ${state.respuestas.length}

INDICADORES DETECTADOS:
${state.indicators.length > 0 ? state.indicators.join('\n') : 'Ninguno'}

─────────────────────────────────────────────────────

RESPUESTAS DEL ESTUDIANTE:

${state.respuestas.map((r, i) => `Respuesta ${i + 1}:\n"${r}"\n`).join('\n')}

─────────────────────────────────────────────────────

ANÁLISIS:

Calidad de respuestas: ${state.respuestas.length >= CONFIG.MIN_RESPONSES_TO_CLOSE ? 'Buena' : 'Regular'}
Indicadores de metacognición: ${state.indicators.length >= CONFIG.MIN_INDICATORS_TO_CLOSE ? 'Presentes' : 'Limitados'}
Progresión de fases: ${state.fase > 1 ? 'Avanzó' : 'Se mantuvo'}

─────────────────────────────────────────────────────

PRÓXIMOS PASOS:

1. Revisar las respuestas y reflexiones
2. Guardar los aprendizajes principales
3. Planificar cómo aplicar esto en la próxima tarea

═══════════════════════════════════════════════════════
Generado por FLAVELL - Agente Metacognitivo
═══════════════════════════════════════════════════════`;

            return report;
        }

        function downloadSessionReport() {
            const report = generateSessionReport();
            const blob = new Blob([report], { type: 'text/plain; charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `FLAVELL-Evaluacion-${state.sessionId}.txt`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }

        async function speakText(text) {
            state.isSpeaking = true;
            try {
                const response = await fetch(CONFIG.API.TTS, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text })
                });

                const data = await response.json();
                if (!response.ok) throw new Error(data.error);

                const audioUrl = `data:audio/mp3;base64,${data.audio}`;
                const audio = new Audio(audioUrl);

                return new Promise((resolve) => {
                    const timeout = setTimeout(() => {
                        state.isSpeaking = false;
                        resolve();
                    }, CONFIG.TTS_TIMEOUT);

                    audio.onended = () => {
                        clearTimeout(timeout);
                        state.isSpeaking = false;
                        resolve();
                    };

                    audio.onerror = () => {
                        clearTimeout(timeout);
                        state.isSpeaking = false;
                        resolve();
                    };

                    audio.play().catch(() => {
                        clearTimeout(timeout);
                        state.isSpeaking = false;
                        resolve();
                    });
                });

            } catch (error) {
                console.error('TTS error:', error);
                state.isSpeaking = false;
            }
        }

        async function logToSheet(data) {
            try {
                const payload = {
                    sessionId: state.sessionId,
                    userId: state.userId,
                    userName: state.userName,
                    userEmail: state.userEmail,
                    turno: data.turno,
                    fase: data.fase,
                    speaker: data.speaker,
                    tipo: data.tipo,
                    texto: data.texto || '',
                    indicadores: data.indicadores || '',
                    respuestasCount: data.respuestasCount || ''
                };

                await fetch(CONFIG.SHEETS_WEBHOOK, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: JSON.stringify(payload)
                });
            } catch (error) {
                console.error('Log error:', error);
            }
        }

        function showMiraText(text) {
            const dialogue = document.getElementById('dialogueArea');
            dialogue.innerHTML = '';
            const div = document.createElement('div');
            div.className = 'mira-text';
            div.textContent = text;
            dialogue.appendChild(div);
        }

        function showStudentText(text) {
            const dialogue = document.getElementById('dialogueArea');
            const div = document.createElement('div');
            div.className = 'student-text';
            div.textContent = text;
            dialogue.appendChild(div);
        }

        function showTyping() {
            const dialogue = document.getElementById('dialogueArea');
            const div = document.createElement('div');
            div.id = 'typingIndicator';
            div.className = 'typing-dots';
            div.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';
            dialogue.appendChild(div);
        }

        function hideTyping() {
            document.getElementById('typingIndicator')?.remove();
        }

        function clearDialogue() {
            document.getElementById('dialogueArea').innerHTML = '';
        }

        function updateStatus(text, type = '') {
            const el = document.getElementById('statusText');
            el.textContent = text;
            el.className = `status ${type === 'active' ? 'active' : type === 'error' ? 'warning' : type === 'success' ? 'success' : ''}`;
        }

        function updatePhase(phase) {
            const labels = { 1: 'Planificación', 2: 'Ejecución', 3: 'Reflexión' };
            document.getElementById('phaseIndicator').textContent = `Fase ${phase}: ${labels[phase]}`;
        }

        function updateProgress() {
            const el = document.getElementById('progressIndicator');
            el.textContent = `Respuestas: ${state.respuestas.length} | Indicadores: ${state.indicators.length}`;
        }

        function setMicState(state) {
            const btn = document.getElementById('micButton');
            btn.className = `mic-button ${state}`;
            btn.disabled = state !== 'available';

            if (state === 'available') {
                btn.onmousedown = startRecording;
                btn.onmouseup = stopRecording;
                btn.ontouchstart = (e) => { e.preventDefault(); startRecording(); };
                btn.ontouchend = (e) => { e.preventDefault(); stopRecording(); };
            }
        }

        window.addEventListener('DOMContentLoaded', initGoogleAuth);
    </script>

</body>
</html>
