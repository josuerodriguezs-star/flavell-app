<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLAVELL — Evaluación Metacognitiva</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        /* ===== RESET Y VARIABLES ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0e27;
            --bg-secondary: #111829;
            --bg-tertiary: #0f1a33;
            --bg-hover: #1a2847;
            --border-color: #1a2847;
            --text-primary: #e8e8e8;
            --text-secondary: #888888;
            --accent-orange: #ff9d4d;
            --accent-orange-light: rgba(255, 157, 77, 0.15);
            --accent-orange-border: rgba(255, 157, 77, 0.2);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }

        /* ===== CONTENEDOR PRINCIPAL ===== */
        .container {
            width: 100%;
            max-width: 720px;
            background: var(--bg-secondary);
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 90vh;
            border: 1px solid var(--border-color);
        }

        /* ===== BARRA SUPERIOR ===== */
        .top-bar {
            background: linear-gradient(135deg, var(--bg-tertiary) 0%, var(--bg-hover) 100%);
            padding: 18px 24px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex: 0 0 auto;
        }

        .top-bar-left {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .app-title {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: #fff;
        }

        .app-subtitle {
            font-size: 11px;
            color: var(--text-secondary);
            letter-spacing: 0.3px;
        }

        .phase-badge {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent-orange);
            background: var(--accent-orange-light);
            padding: 6px 12px;
            border-radius: 4px;
            border: 1px solid var(--accent-orange-border);
            white-space: nowrap;
        }

        /* ===== ÁREA DE CONVERSACIÓN ===== */
        .conversation-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scroll-behavior: smooth;
        }

        .conversation-container::-webkit-scrollbar {
            width: 6px;
        }

        .conversation-container::-webkit-scrollbar-track {
            background: transparent;
        }

        .conversation-container::-webkit-scrollbar-thumb {
            background: rgba(255, 157, 77, 0.3);
            border-radius: 3px;
        }

        .conversation-container::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 157, 77, 0.5);
        }

        /* ===== MENSAJES ===== */
        .message {
            display: flex;
            animation: slideIn 0.3s cubic-bezier(0.4, 0, 0.2, 1) forwards;
            opacity: 0;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.mira-msg {
            justify-content: flex-start;
        }

        .message.student-msg {
            justify-content: flex-end;
        }

        .message-bubble {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.55;
            word-wrap: break-word;
            animation: bubbleIn 0.3s ease;
        }

        @keyframes bubbleIn {
            from {
                transform: scale(0.95);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .message.mira-msg .message-bubble {
            background: var(--bg-hover);
            color: var(--text-primary);
            border-left: 3px solid var(--accent-orange);
        }

        .message.student-msg .message-bubble {
            background: var(--accent-orange-light);
            color: var(--text-primary);
            border-right: 3px solid var(--accent-orange);
        }

        /* ===== INDICADOR DE ESCRITURA ===== */
        .typing-container {
            display: flex;
            gap: 6px;
            padding: 12px 16px;
            background: var(--bg-hover);
            border-radius: 8px;
            border-left: 3px solid var(--accent-orange);
            width: fit-content;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            background: var(--accent-orange);
            border-radius: 50%;
            animation: typingBounce 1.4s infinite ease-in-out;
        }

        .typing-dot:nth-child(1) {
            animation-delay: 0s;
        }

        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typingBounce {
            0%, 60%, 100% {
                opacity: 0.3;
                transform: translateY(0);
            }
            30% {
                opacity: 1;
                transform: translateY(-8px);
            }
        }

        /* ===== BARRA DE ESTADO ===== */
        .status-bar {
            background: var(--bg-tertiary);
            padding: 12px 24px;
            border-top: 1px solid var(--border-color);
            font-size: 12px;
            color: var(--text-secondary);
            text-align: center;
            letter-spacing: 0.4px;
            flex: 0 0 auto;
            transition: color 0.2s ease;
        }

        .status-bar.active {
            color: var(--accent-orange);
            font-weight: 600;
        }

        .status-bar.error {
            color: #ff6b6b;
        }

        /* ===== ÁREA DE ENTRADA ===== */
        .input-container {
            background: var(--bg-tertiary);
            padding: 16px 24px;
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 10px;
            flex: 0 0 auto;
        }

        .input-field {
            flex: 1;
            background: var(--bg-hover);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 11px 14px;
            color: var(--text-primary);
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: all 0.2s ease;
        }

        .input-field::placeholder {
            color: var(--text-secondary);
        }

        .input-field:focus {
            border-color: var(--accent-orange);
            box-shadow: 0 0 0 3px var(--accent-orange-light);
        }

        .input-field:disabled {
            background: rgba(26, 40, 71, 0.5);
            color: var(--text-secondary);
            cursor: not-allowed;
        }

        .send-button {
            background: rgba(255, 157, 77, 0.15);
            border: 1.5px solid var(--accent-orange);
            color: var(--accent-orange);
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 12px;
            font-family: inherit;
            letter-spacing: 0.4px;
            transition: all 0.2s ease;
            white-space: nowrap;
            flex: 0 0 auto;
        }

        .send-button:hover:not(:disabled) {
            background: rgba(255, 157, 77, 0.25);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(255, 157, 77, 0.2);
        }

        .send-button:active:not(:disabled) {
            transform: translateY(0);
        }

        .send-button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* ===== MODAL DE LOGIN ===== */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.95);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(2px);
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 48px 40px;
            text-align: center;
            max-width: 420px;
            width: 100%;
            animation: modalSlideIn 0.3s ease;
        }

        @keyframes modalSlideIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .modal-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #fff;
            letter-spacing: -0.5px;
        }

        .modal-subtitle {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 32px;
            line-height: 1.6;
            letter-spacing: 0.3px;
        }

        .modal-divider {
            width: 40px;
            height: 3px;
            background: var(--accent-orange);
            margin: 0 auto 32px;
        }

        #google-signin-button {
            margin-top: 20px;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 600px) {
            .container {
                height: 100vh;
                border-radius: 0;
                max-width: 100%;
            }

            .message-bubble {
                max-width: 85%;
            }

            .modal-content {
                padding: 32px 24px;
                margin: 20px;
            }

            .modal-title {
                font-size: 24px;
            }

            .top-bar {
                flex-wrap: wrap;
                gap: 12px;
            }

            .phase-badge {
                order: 3;
                flex-basis: 100%;
            }
        }

        /* ===== UTILIDADES ===== */
        .hidden {
            display: none !important;
        }

        .fade-in {
            animation: fadeIn 0.3s ease forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
    </style>
</head>
<body>

    <!-- ===== MODAL DE AUTENTICACIÓN ===== -->
    <div class="modal active" id="loginModal">
        <div class="modal-content">
            <div class="modal-title">FLAVELL</div>
            <div class="modal-subtitle">
                Evaluación Metacognitiva<br>
                <span style="font-size: 12px;">Powered by Anthropic</span>
            </div>
            <div class="modal-divider"></div>
            <div id="google-signin-button"></div>
        </div>
    </div>

    <!-- ===== APLICACIÓN PRINCIPAL ===== -->
    <div class="container hidden" id="appContainer">
        <!-- Barra superior -->
        <div class="top-bar">
            <div class="top-bar-left">
                <div class="app-title">FLAVELL</div>
                <div class="app-subtitle" id="userGreeting">Hola</div>
            </div>
            <div class="phase-badge" id="phaseBadge">Fase 1</div>
        </div>

        <!-- Área de conversación -->
        <div class="conversation-container" id="conversationContainer"></div>

        <!-- Barra de estado -->
        <div class="status-bar" id="statusBar">Conectando...</div>

        <!-- Área de entrada -->
        <div class="input-container">
            <input
                type="text"
                class="input-field"
                id="messageInput"
                placeholder="Escribe tu respuesta..."
                disabled
            >
            <button class="send-button" id="sendButton" onclick="sendMessage()" disabled>
                Enviar
            </button>
        </div>
    </div>

    <script>
        // ===== CONFIGURACIÓN GLOBAL =====
        const CONFIG = {
            GOOGLE_CLIENT_ID: '1024048650335-et8uu1tgifepgbbfdh6hr7md1bb1hf7q.apps.googleusercontent.com',
            ANTHROPIC_API: '/api/chat',
            SHEETS_WEBHOOK: 'https://script.google.com/macros/s/AKfycbyUJVuKeuKY7OhaJQyKU66E1hawloxg-rZRW58zoSwPhu3fQpncZY5OegjrBYOKp9dW/exec',
            MAX_TURNS: 12,
            PHASE_DETECTION_KEYWORDS: {
                2: ['ya empecé', 'estoy', 'hice', 'leo', 'leyendo', 'haciendo', 'resolviendo'],
                3: ['ya terminé', 'acabé', 'finalizé', 'aprendí', 'descubrí', 'si lo hiciera']
            }
        };

        // ===== ESTADO GLOBAL =====
        const state = {
            // Autenticación
            userId: null,
            userName: null,
            userEmail: null,
            
            // Sesión
            sessionId: null,
            sessionStart: null,
            
            // Conversación
            turno: 0,
            fase: 1,
            history: [],
            transcript: [],
            isComplete: false,
            isLoading: false,
            
            // Timestamps
            lastMessageTime: Date.now()
        };

        // ===== INICIALIZACIÓN GOOGLE AUTH =====
        function initializeGoogleAuth() {
            google.accounts.id.initialize({
                client_id: CONFIG.GOOGLE_CLIENT_ID,
                callback: handleGoogleLogin,
                auto_select: false
            });

            google.accounts.id.renderButton(
                document.getElementById('google-signin-button'),
                {
                    theme: 'outline',
                    size: 'large',
                    text: 'signin_with',
                    logo_alignment: 'center'
                }
            );
        }

        function handleGoogleLogin(response) {
            try {
                // Decodificar JWT
                const base64Url = response.credential.split('.')[1];
                const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                const jsonPayload = decodeURIComponent(
                    atob(base64)
                        .split('')
                        .map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2))
                        .join('')
                );

                const userData = JSON.parse(jsonPayload);

                // Guardar datos en estado
                state.userId = userData.sub;
                state.userName = userData.name;
                state.userEmail = userData.email;
                state.sessionId = `${state.userId}-${Date.now()}`;
                state.sessionStart = new Date().toISOString();

                // Actualizar UI
                document.getElementById('loginModal').classList.remove('active');
                document.getElementById('appContainer').classList.remove('hidden');
                document.getElementById('userGreeting').textContent = `Hola, ${state.userName.split(' ')[0]}`;

                // Iniciar entrevista
                startInterview();

            } catch (error) {
                logError('Error en autenticación Google', error);
                updateStatus('Error en autenticación. Intenta de nuevo.', 'error');
            }
        }

        // ===== FLUJO DE ENTREVISTA =====
        async function startInterview() {
            state.turno = 1;
            state.fase = 1;
            
            updateStatus('Conectando con Mira...', 'active');
            updatePhaseBadge(1);

            try {
                const apertura = await generateMiraResponse('apertura', null);
                addMessage('mira', apertura);
                
                logToSheet({
                    turno: state.turno,
                    fase: 1,
                    speaker: 'mira',
                    tipo: 'apertura',
                    actividad: '',
                    texto: apertura,
                    latencia: 0,
                    indicadores: ''
                });

                enableInput(true);
                updateStatus('Tu turno');

            } catch (error) {
                logError('Error iniciando entrevista', error);
                updateStatus('Error al conectar. Recarga la página.', 'error');
            }
        }

        async function sendMessage() {
            const text = document.getElementById('messageInput').value.trim();
            
            if (!text || state.isLoading || state.isComplete) {
                return;
            }

            // Limpiar input
            document.getElementById('messageInput').value = '';
            enableInput(false);

            state.turno++;
            const responseTime = Date.now();

            // Agregar mensaje del estudiante
            addMessage('student', text);

            // Detectar nueva fase
            const newPhase = detectPhase(text);
            if (newPhase !== state.fase) {
                state.fase = newPhase;
                updatePhaseBadge(newPhase);
            }

            // Registrar respuesta estudiante
            logToSheet({
                turno: state.turno - 0.5,
                fase: state.fase,
                speaker: 'student',
                tipo: 'respuesta',
                actividad: '',
                texto: text,
                latencia: (Date.now() - state.lastMessageTime) / 1000,
                indicadores: ''
            });

            // Generar respuesta de Mira
            showTyping();
            updateStatus('Mira está pensando...', 'active');

            try {
                const response = await generateMiraResponse(state.fase, text);
                hideTyping();
                
                addMessage('mira', response);

                const latency = (Date.now() - responseTime) / 1000;

                // Registrar respuesta Mira
                logToSheet({
                    turno: state.turno,
                    fase: state.fase,
                    speaker: 'mira',
                    tipo: 'respuesta',
                    actividad: '',
                    texto: response,
                    latencia: latency,
                    indicadores: ''
                });

                // Verificar condiciones de cierre
                if (shouldClose(response, state.turno)) {
                    state.isComplete = true;
                    enableInput(false);
                    updateStatus('Sesión completada. ¡Muchas gracias!', 'active');
                    
                    // Log final de sesión
                    logToSheet({
                        turno: state.turno + 1,
                        fase: state.fase,
                        speaker: 'system',
                        tipo: 'session-end',
                        actividad: '',
                        texto: `Sesión completada. Turnos totales: ${state.turno}`,
                        latencia: 0,
                        indicadores: 'sesión_completada'
                    });
                } else {
                    enableInput(true);
                    updateStatus('Tu turno');
                    state.lastMessageTime = Date.now();
                }

            } catch (error) {
                hideTyping();
                logError('Error generando respuesta', error);
                updateStatus('Error. Intenta de nuevo.', 'error');
                enableInput(true);
            }
        }

        // ===== GENERACIÓN DE RESPUESTAS CON CLAUDE =====
        async function generateMiraResponse(phase, studentText) {
            state.isLoading = true;

            try {
                const systemPrompt = buildSystemPrompt(phase);
                const userPrompt = buildUserPrompt(phase, studentText);

                const response = await fetch(CONFIG.ANTHROPIC_API, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        system_instruction: { parts: [{ text: systemPrompt }] },
                        contents: state.history.length > 0 
                            ? state.history
                            : [{ role: 'user', parts: [{ text: userPrompt }] }],
                        generationConfig: {
                            temperature: 0.85,
                            maxOutputTokens: 250
                        }
                    })
                });

                if (!response.ok) {
                    throw new Error(`API error: ${response.status}`);
                }

                const data = await response.json();
                const text = data.candidates?.[0]?.content?.parts?.[0]?.text || 'Error al generar respuesta';

                // Actualizar historial
                if (state.history.length === 0) {
                    state.history.push(
                        { role: 'user', parts: [{ text: userPrompt }] },
                        { role: 'model', parts: [{ text }] }
                    );
                } else {
                    state.history.push(
                        { role: 'user', parts: [{ text: userPrompt }] },
                        { role: 'model', parts: [{ text }] }
                    );
                }

                // Limpiar respuesta
                const clean = text.replace(/\*/g, '').trim();
                return clean;

            } catch (error) {
                throw error;
            } finally {
                state.isLoading = false;
            }
        }

        // ===== PROMPTS PARA CLAUDE =====
        function buildSystemPrompt(phase) {
            const basePrompt = `Eres Mira, un evaluador metacognitivo experto. Tu rol es conducir una entrevista socrática para evaluar habilidades metacognitivas.

REGLAS CRÍTICAS:
- Responde SIEMPRE en español
- Una sola pregunta o actividad por turno
- Máximo 2-3 oraciones, sé conciso
- NO uses asteriscos, markdown ni formatos especiales
- Sé conversacional, empático, no académico
- Adapta según la fase del estudiante`;

            const phaseGuides = {
                1: `FASE 1 — PLANIFICACIÓN
El estudiante está en la etapa inicial. Su respuesta sugiere que no ha empezado o está planificando.
- Pregunta sobre su comprensión de la tarea
- Indaga qué estrategias planea usar
- Averigua qué conoce ya del tema`,
                
                2: `FASE 2 — EJECUCIÓN
El estudiante está en medio del proceso. Ha mencionado acciones concretas.
- Pregunta qué le cuesta trabajo
- Indaga si está chequeando su progreso
- Detecta bloqueos o dificultades`,
                
                3: `FASE 3 — AUTORREFLEXIÓN
El estudiante ha terminado o puede evaluar su proceso completo.
- Pregunta qué aprendió
- Indaga qué haría diferente
- Busca síntesis y transferencia`
            };

            return basePrompt + '\n\n' + phaseGuides[phase];
        }

        function buildUserPrompt(phase, studentText) {
            if (!studentText) {
                return 'Por favor, comienza la entrevista metacognitiva. Presenta la apertura: "Hola, soy Mira. Cuéntame, ¿en qué estás trabajando ahorita?"';
            }

            return `Última respuesta del estudiante: "${studentText}"

Basándote en su respuesta, formula una sola pregunta o actividad que:
1. Sea apropiada para la FASE ${phase}
2. Profundice en su proceso de aprendizaje
3. Sea natural y conversacional`;
        }

        // ===== DETECCIÓN DE FASES =====
        function detectPhase(text) {
            const lower = text.toLowerCase();

            // Detectar FASE 3 (Reflexión)
            if (CONFIG.PHASE_DETECTION_KEYWORDS[3].some(kw => lower.includes(kw))) {
                return 3;
            }

            // Detectar FASE 2 (Ejecución)
            if (CONFIG.PHASE_DETECTION_KEYWORDS[2].some(kw => lower.includes(kw))) {
                return 2;
            }

            // Default: FASE 1
            return 1;
        }

        // ===== LÓGICA DE CIERRE =====
        function shouldClose(response, turnoActual) {
            // Criterios de cierre
            const hasCompletion = response.toLowerCase().includes('muchas gracias') || 
                                  response.toLowerCase().includes('hasta la próxima');
            const maxTurnsReached = turnoActual >= CONFIG.MAX_TURNS;

            return hasCompletion || maxTurnsReached;
        }

        // ===== LOGGING A GOOGLE SHEETS =====
        async function logToSheet(logData) {
            try {
                const payload = {
                    sessionId: state.sessionId,
                    userId: state.userId,
                    userEmail: state.userEmail,
                    userName: state.userName,
                    turno: logData.turno,
                    fase: logData.fase,
                    speaker: logData.speaker,
                    tipo: logData.tipo,
                    actividad: logData.actividad,
                    texto: (logData.texto || '').substring(0, 500),
                    latencia: logData.latencia,
                    indicadores: logData.indicadores
                };

                const response = await fetch(CONFIG.SHEETS_WEBHOOK, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    console.log('[FLAVELL] Log registrado correctamente');
                } else {
                    console.warn('[FLAVELL] Error en logging:', response.status);
                }

            } catch (error) {
                console.error('[FLAVELL] Error logging a Sheets:', error);
            }
        }

        // ===== UTILIDADES UI =====
        function addMessage(role, text) {
            const container = document.getElementById('conversationContainer');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role === 'mira' ? 'mira-msg' : 'student-msg'}`;
            messageDiv.innerHTML = `<div class="message-bubble">${escapeHtml(text)}</div>`;
            container.appendChild(messageDiv);
            container.scrollTop = container.scrollHeight;

            // Guardar en transcript
            state.transcript.push({
                role,
                text,
                timestamp: new Date().toISOString(),
                fase: state.fase
            });
        }

        function showTyping() {
            const container = document.getElementById('conversationContainer');
            const typingDiv = document.createElement('div');
            typingDiv.id = 'typingIndicator';
            typingDiv.className = 'message mira-msg';
            typingDiv.innerHTML = `
                <div class="typing-container">
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                </div>
            `;
            container.appendChild(typingDiv);
            container.scrollTop = container.scrollHeight;
        }

        function hideTyping() {
            document.getElementById('typingIndicator')?.remove();
        }

        function updatePhaseBadge(phase) {
            const labels = {
                1: 'Planificación',
                2: 'Ejecución',
                3: 'Reflexión'
            };
            document.getElementById('phaseBadge').textContent = labels[phase];
        }

        function updateStatus(text, type = '') {
            const statusBar = document.getElementById('statusBar');
            statusBar.textContent = text;
            statusBar.classList.remove('active', 'error');
            if (type) statusBar.classList.add(type);
        }

        function enableInput(enabled) {
            document.getElementById('messageInput').disabled = !enabled;
            document.getElementById('sendButton').disabled = !enabled;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function logError(context, error) {
            console.error(`[FLAVELL] ${context}:`, error);
        }

        // ===== EVENT LISTENERS =====
        document.getElementById('messageInput').addEventListener('keypress', e => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // ===== INICIALIZACIÓN =====
        window.addEventListener('DOMContentLoaded', () => {
            initializeGoogleAuth();
            console.log('[FLAVELL] Aplicación inicializada');
        });
    </script>

</body>
</html>
