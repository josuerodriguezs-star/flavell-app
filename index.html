<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLAVELL — Mira</title>
    <script src="https://accounts.google.com/gsi/client"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-black: #000000;
            --text-white: #ffffff;
            --text-gray: #b0b0b0;
            --text-gray-dark: #808080;
            --accent-orange: #ff9d4d;
            --status-green: #4ade80;
            --status-red: #ef4444;
            --status-gray: #6b7280;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
            background: var(--bg-black);
            color: var(--text-white);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            height: 90vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            position: relative;
        }

        /* MODAL */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.98);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            text-align: center;
        }

        .modal-title {
            font-size: 48px;
            font-weight: 700;
            margin-bottom: 16px;
            color: var(--text-white);
            letter-spacing: 2px;
        }

        .modal-subtitle {
            font-size: 18px;
            color: var(--text-gray);
            margin-bottom: 8px;
            font-weight: 400;
        }

        .modal-agent {
            font-size: 14px;
            color: var(--accent-orange);
            font-weight: 700;
            margin-bottom: 40px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        #google-signin-button {
            margin-top: 30px;
        }

        /* HEADER */
        .header {
            text-align: center;
            width: 100%;
        }

        .header-title {
            font-size: 36px;
            font-weight: 700;
            color: var(--text-white);
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .header-agent {
            font-size: 14px;
            color: var(--accent-orange);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        .header-user {
            font-size: 16px;
            color: var(--text-gray);
            margin-top: 4px;
            font-weight: 400;
        }

        .header-phase {
            font-size: 12px;
            color: var(--text-gray-dark);
            margin-top: 8px;
            font-style: italic;
            font-weight: 300;
        }

        .header-safety {
            font-size: 10px;
            color: var(--status-red);
            margin-top: 8px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* DIALOGUE AREA */
        .dialogue-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 30px 20px;
            gap: 20px;
            min-height: 300px;
        }

        .mira-text {
            font-size: 20px;
            line-height: 1.8;
            color: var(--text-white);
            text-align: center;
            max-width: 95%;
            font-weight: 400;
            letter-spacing: 0.5px;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .student-text {
            font-size: 18px;
            line-height: 1.7;
            color: var(--text-gray);
            text-align: center;
            max-width: 95%;
            font-weight: 400;
            letter-spacing: 0.4px;
            animation: fadeOut 6s ease-in-out forwards;
            margin-top: 20px;
        }

        @keyframes fadeOut {
            0% { opacity: 1; }
            85% { opacity: 1; }
            100% { opacity: 0; }
        }

        .typing-dots {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-top: 20px;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            background: var(--accent-orange);
            border-radius: 50%;
            animation: typingBounce 1.4s infinite;
        }

        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typingBounce {
            0%, 60%, 100% { opacity: 0.4; transform: translateY(0); }
            30% { opacity: 1; transform: translateY(-10px); }
        }

        /* CONTROL AREA */
        .control-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            width: 100%;
        }

        .mic-button {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            border: none;
            background: var(--status-green);
            color: white;
            font-size: 64px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 12px 48px rgba(74, 222, 128, 0.4);
            font-weight: bold;
        }

        .mic-button.available {
            background: var(--status-green);
            box-shadow: 0 12px 48px rgba(74, 222, 128, 0.4);
            cursor: pointer;
        }

        .mic-button.available:hover {
            transform: scale(1.1);
            box-shadow: 0 16px 64px rgba(74, 222, 128, 0.6);
        }

        .mic-button.recording {
            background: var(--status-red);
            box-shadow: 0 0 40px rgba(239, 68, 68, 0.7);
            animation: pulse-record 0.8s infinite;
            cursor: default;
        }

        .mic-button.speaking {
            background: var(--status-gray);
            box-shadow: 0 12px 48px rgba(107, 114, 128, 0.3);
            cursor: not-allowed;
            opacity: 0.6;
        }

        .mic-button.processing {
            background: var(--status-gray);
            box-shadow: 0 12px 48px rgba(107, 114, 128, 0.3);
            cursor: not-allowed;
        }

        .mic-button.closed {
            background: var(--status-red);
            cursor: not-allowed;
            opacity: 0.4;
        }

        @keyframes pulse-record {
            0%, 100% { 
                box-shadow: 0 0 30px rgba(239, 68, 68, 0.5);
                transform: scale(1);
            }
            50% { 
                box-shadow: 0 0 60px rgba(239, 68, 68, 0.9);
                transform: scale(1.03);
            }
        }

        .status {
            font-size: 14px;
            color: var(--text-gray);
            text-align: center;
            min-height: 20px;
            letter-spacing: 0.5px;
            font-weight: 400;
        }

        .status.active {
            color: var(--accent-orange);
            font-weight: 600;
        }

        .status.warning {
            color: var(--status-red);
            font-weight: 700;
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 600px) {
            .mic-button { 
                width: 120px; 
                height: 120px; 
                font-size: 56px;
            }
            .container {
                gap: 20px;
            }
            .mira-text {
                font-size: 18px;
            }
            .student-text {
                font-size: 16px;
            }
            .header-title {
                font-size: 32px;
            }
        }
    </style>
</head>
<body>

    <div class="modal active" id="loginModal">
        <div class="modal-content">
            <div class="modal-title">FLAVELL</div>
            <div class="modal-subtitle">Evaluación Metacognitiva</div>
            <div class="modal-agent">Powered by Mira</div>
            <div id="google-signin-button"></div>
        </div>
    </div>

    <div class="container hidden" id="appContainer">
        
        <div class="header">
            <div class="header-title">FLAVELL</div>
            <div class="header-agent">Mira</div>
            <div class="header-user" id="userGreeting">Hola</div>
            <div class="header-phase" id="phaseIndicator">Fase 1: Planificación</div>
            <div class="header-safety" id="safetyIndicator"></div>
        </div>

        <div class="dialogue-area" id="dialogueArea"></div>

        <div class="control-area">
            <button class="mic-button available" id="micButton">🎤</button>
            <div class="status" id="statusText">Presiona para hablar</div>
        </div>

    </div>

    <script>
        const CONFIG = {
            GOOGLE_CLIENT_ID: '1024048650335-et8uu1tgifepgbbfdh6hr7md1bb1hf7q.apps.googleusercontent.com',
            SHEETS_WEBHOOK: 'https://script.google.com/macros/s/AKfycby...../exec?token=flavell-mira-token-2024-anáhuac-xyz123',
            MAX_TURNS: 12,
            MAX_FAILED_ATTEMPTS: 3,
            TTS_TIMEOUT: 8000,
            API: {
                WHISPER: '/api/whisper',
                GPT: '/api/gpt',
                TTS: '/api/tts'
            }
        };

        const state = {
            userId: null,
            userName: null,
            userEmail: null,
            sessionId: null,
            turno: 0,
            fase: 1,
            isRecording: false,
            isProcessing: false,
            isSpeaking: false,
            mediaRecorder: null,
            audioChunks: [],
            intentosFallidos: 0,
            respuestasValidas: [],
            respuestasInvalidas: [],
            sessionClosed: false,
            motivoCierre: null,
            currentMiraText: null,
            startTime: null,
            lastActionTime: null
        };

        // ===== TIMING =====
        function getLatency() {
            if (!state.lastActionTime) return 0;
            return Date.now() - state.lastActionTime;
        }

        function markAction() {
            state.lastActionTime = Date.now();
        }

        function initGoogleAuth() {
            google.accounts.id.initialize({
                client_id: CONFIG.GOOGLE_CLIENT_ID,
                callback: handleGoogleLogin
            });

            google.accounts.id.renderButton(
                document.getElementById('google-signin-button'),
                { theme: 'outline', size: 'large', text: 'signin_with' }
            );
        }

        function handleGoogleLogin(response) {
            try {
                const base64Url = response.credential.split('.')[1];
                const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                const jsonPayload = decodeURIComponent(
                    atob(base64).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join('')
                );

                const userData = JSON.parse(jsonPayload);
                state.userId = userData.sub;
                state.userName = userData.name;
                state.userEmail = userData.email;
                state.sessionId = `${state.userId}-${Date.now()}`;
                state.startTime = Date.now();
                markAction();

                document.getElementById('loginModal').classList.remove('active');
                document.getElementById('appContainer').classList.remove('hidden');
                document.getElementById('userGreeting').textContent = state.userName.split(' ')[0];

                startInterview();
            } catch (error) {
                console.error('Auth error:', error);
                updateStatus('Error en autenticación', 'error');
            }
        }

        async function startInterview() {
            state.turno = 1;
            state.fase = 1;
            updateStatus('Iniciando...', 'active');
            markAction();

            try {
                const apertura = await callGPT('apertura', null);
                showMiraText(apertura);
                
                setMicState('speaking');
                await speakText(apertura);
                markAction();
                
                logToSheet({ 
                    turno: state.turno, 
                    fase: 1, 
                    speaker: 'mira', 
                    tipo: 'apertura', 
                    actividad: 'greeting',
                    texto: apertura,
                    latencia: getLatency(),
                    indicadores: 'inicio_sesion'
                });

                updateStatus('Lee y presiona cuando estés listo', 'active');
                setMicState('available');

            } catch (error) {
                console.error('Start error:', error);
                updateStatus('Error al iniciar', 'error');
                setMicState('available');
            }
        }

        function isValidResponse(text) {
            if (!text || text.trim().length === 0) return false;
            if (text.trim().length < 3) return false;
            if (/^[0-9\s\.\,\!\?]+$/.test(text.trim())) return false;
            if (text.toLowerCase() === 'no' || text.toLowerCase() === 'sí' || text.toLowerCase() === 'si') return false;
            return true;
        }

        function classifyResponse(text) {
            const lower = text.toLowerCase();
            
            // Detectar si es respuesta corta o elaborada
            if (text.split(' ').length < 5) {
                return 'respuesta_breve';
            } else if (text.split(' ').length >= 5 && text.split(' ').length < 15) {
                return 'respuesta_moderada';
            } else {
                return 'respuesta_elaborada';
            }
        }

        function handleFailedAttempt(userText) {
            state.intentosFallidos++;
            state.respuestasInvalidas.push({ turno: state.turno, texto: userText });

            const remaining = CONFIG.MAX_FAILED_ATTEMPTS - state.intentosFallidos;

            if (state.intentosFallidos >= CONFIG.MAX_FAILED_ATTEMPTS) {
                closeSession('Demasiados intentos sin respuestas válidas');
                return false;
            }

            updateSafetyIndicator();
            return true;
        }

        function handleSuccessfulAttempt(userText) {
            state.intentosFallidos = 0;
            state.respuestasValidas.push({ turno: state.turno, texto: userText });
            updateSafetyIndicator();
        }

        function updateSafetyIndicator() {
            const el = document.getElementById('safetyIndicator');
            if (state.intentosFallidos === 0) {
                el.textContent = '';
                el.style.display = 'none';
            } else {
                const remaining = CONFIG.MAX_FAILED_ATTEMPTS - state.intentosFallidos;
                el.textContent = `⚠️ ${remaining} intento${remaining !== 1 ? 's' : ''} restante`;
                el.style.display = 'block';
            }
        }

        function closeSession(motivo) {
            state.sessionClosed = true;
            state.motivoCierre = motivo;
            setMicState('closed');
            updateStatus(`Sesión cerrada: ${motivo}`, 'warning');

            logToSheet({
                turno: state.turno,
                fase: state.fase,
                speaker: 'sistema',
                tipo: 'cierre',
                actividad: 'session_close',
                texto: motivo,
                latencia: getLatency(),
                indicadores: `intentos_fallidos:${state.intentosFallidos}|respuestas_validas:${state.respuestasValidas.length}|respuestas_invalidas:${state.respuestasInvalidas.length}`
            });
        }

        async function startRecording() {
            if (state.sessionClosed || state.isSpeaking) return;

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                state.mediaRecorder = new MediaRecorder(stream);
                state.audioChunks = [];

                state.mediaRecorder.ondataavailable = (event) => {
                    state.audioChunks.push(event.data);
                };

                state.mediaRecorder.onstop = async () => {
                    await processAudio();
                };

                state.mediaRecorder.start();
                state.isRecording = true;
                setMicState('recording');
                updateStatus('Hablando...', 'active');

            } catch (error) {
                console.error('Mic error:', error);
                updateStatus('Error acceso micrófono', 'error');
            }
        }

        function stopRecording() {
            if (state.mediaRecorder && state.isRecording) {
                state.mediaRecorder.stop();
                state.isRecording = false;
                setMicState('processing');
                updateStatus('Procesando...', 'active');
            }
        }

        async function processAudio() {
            try {
                const audioBlob = new Blob(state.audioChunks, { type: 'audio/webm' });
                
                const reader = new FileReader();
                reader.onload = async () => {
                    try {
                        const audioBase64 = reader.result.split(',')[1];
                        
                        const transcriptResponse = await fetch(CONFIG.API.WHISPER, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ audio: audioBase64 })
                        });

                        if (!transcriptResponse.ok) {
                            throw new Error(`Whisper error: ${transcriptResponse.status}`);
                        }

                        const transcriptData = await transcriptResponse.json();
                        const userText = transcriptData.text || '';

                        if (!userText.trim()) {
                            updateStatus('No se capturó audio. Intenta de nuevo.', 'error');
                            setMicState('available');
                            return;
                        }

                        if (!isValidResponse(userText)) {
                            showStudentText(`"${userText}" - No parece válida.`);
                            
                            if (!handleFailedAttempt(userText)) {
                                return;
                            }

                            const responseType = classifyResponse(userText);
                            logToSheet({ 
                                turno: state.turno, 
                                fase: state.fase, 
                                speaker: 'student', 
                                tipo: 'respuesta_invalida', 
                                actividad: responseType,
                                texto: userText,
                                latencia: getLatency(),
                                indicadores: `intentos_fallidos:${state.intentosFallidos}`
                            });

                            updateStatus('Respuesta no válida. Intenta de nuevo.', 'error');
                            setMicState('available');
                            return;
                        }

                        handleSuccessfulAttempt(userText);
                        showStudentText(userText);
                        markAction();

                        const responseType = classifyResponse(userText);
                        logToSheet({ 
                            turno: state.turno + 0.5, 
                            fase: state.fase, 
                            speaker: 'student', 
                            tipo: 'respuesta', 
                            actividad: responseType,
                            texto: userText,
                            latencia: getLatency(),
                            indicadores: `valida:true`
                        });

                        const newPhase = detectPhase(userText);
                        if (newPhase !== state.fase) {
                            state.fase = newPhase;
                            updatePhase(newPhase);
                        }

                        state.turno++;
                        updateStatus('Mira está reflexionando...', 'active');
                        showTyping();
                        setMicState('processing');

                        const response = await callGPT(state.fase, userText);
                        hideTyping();
                        markAction();

                        clearDialogue();
                        showMiraText(response);
                        
                        setMicState('speaking');
                        updateStatus('Mira está hablando...', 'active');
                        await speakText(response);
                        markAction();

                        logToSheet({ 
                            turno: state.turno, 
                            fase: state.fase, 
                            speaker: 'mira', 
                            tipo: 'respuesta', 
                            actividad: 'reflexion',
                            texto: response,
                            latencia: getLatency(),
                            indicadores: `fase:${state.fase}`
                        });

                        if (state.turno >= CONFIG.MAX_TURNS) {
                            closeSession('Sesión completada');
                        } else {
                            updateStatus('Lee y presiona cuando estés listo', 'active');
                            setMicState('available');
                        }
                    } catch (error) {
                        console.error('Processing error:', error);
                        updateStatus('Error procesando audio', 'error');
                        setMicState('available');
                    }
                };

                reader.readAsDataURL(audioBlob);

            } catch (error) {
                console.error('Audio error:', error);
                hideTyping();
                updateStatus('Error procesando audio', 'error');
                setMicState('available');
            }
        }

        async function callGPT(phase, userText) {
            try {
                const systemPrompt = buildSystemPrompt(phase);
                const userPrompt = buildUserPrompt(phase, userText);

                const response = await fetch(CONFIG.API.GPT, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ systemPrompt, userMessage: userPrompt })
                });

                const data = await response.json();
                if (!response.ok) throw new Error(data.error || 'GPT error');
                return data.text;

            } catch (error) {
                console.error('GPT error:', error);
                return 'Disculpa, hubo un error. Intenta de nuevo.';
            }
        }

        async function speakText(text) {
            state.isSpeaking = true;
            
            try {
                const response = await fetch(CONFIG.API.TTS, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text })
                });

                const data = await response.json();
                if (!response.ok) throw new Error(data.error || 'TTS error');

                const audioUrl = `data:audio/mp3;base64,${data.audio}`;
                const audio = new Audio(audioUrl);

                return new Promise((resolve) => {
                    // TIMEOUT: Si TTS no termina en 8s, continuar
                    const timeout = setTimeout(() => {
                        state.isSpeaking = false;
                        console.warn('TTS timeout - continuando');
                        resolve();
                    }, CONFIG.TTS_TIMEOUT);

                    audio.onended = () => {
                        clearTimeout(timeout);
                        state.isSpeaking = false;
                        resolve();
                    };

                    audio.onerror = () => {
                        clearTimeout(timeout);
                        state.isSpeaking = false;
                        console.warn('TTS error - continuando');
                        resolve();
                    };

                    audio.play().catch(() => {
                        clearTimeout(timeout);
                        state.isSpeaking = false;
                        console.warn('TTS play failed - continuando');
                        resolve();
                    });
                });

            } catch (error) {
                console.error('TTS error:', error);
                state.isSpeaking = false;
            }
        }

        function buildSystemPrompt(phase) {
            const base = `Eres Mira, evaluador metacognitivo experto. REGLAS: Responde en español, máximo 2-3 oraciones, sin asteriscos.`;
            const guides = {
                1: 'FASE 1 - PLANIFICACIÓN: Pregunta sobre comprensión de tarea, estrategias, objetivos.',
                2: 'FASE 2 - EJECUCIÓN: Pregunta qué cuesta, si chequea progreso, dificultades.',
                3: 'FASE 3 - REFLEXIÓN: Pregunta qué aprendió, qué haría diferente, logros.'
            };
            return base + '\n' + guides[phase];
        }

        function buildUserPrompt(phase, userText) {
            if (!userText) return 'Comienza: "Hola, soy Mira. Cuéntame, ¿en qué estás trabajando ahorita?"';
            return `Respuesta: "${userText}"\n\nUna pregunta para FASE ${phase}.`;
        }

        function detectPhase(text) {
            const lower = text.toLowerCase();
            
            // FASE 3 - REFLEXIÓN (conclusión)
            if (/terminé|acabé|finalizé|completé|aprendí|descubrí|entendí|me di cuenta|resultó|funcionó|no funcionó|conclusión|resultado|logré|conseguí|dominé|comprendí|asimilé|reflexiono|considera|pensé|analice|evalúe|consideré|mejoraría|cambiaría|siguiente vez|próxima|error|equivocación|reto|desafío/.test(lower)) 
                return 3;
            
            // FASE 2 - EJECUCIÓN (en proceso)
            if (/empecé|estoy|hice|haciendo|leyendo|escribiendo|resolviendo|calculando|analizando|buscando|investigando|encontré|revisando|checando|probando|intentando|aplicando|usando|usando|ejecutando|realizando|desarrollando|construyendo|creando|practique|trabaje|intente|realice|desarrollo|construyo|cree/.test(lower)) 
                return 2;
            
            // FASE 1 - PLANIFICACIÓN (default)
            return 1;
        }

        async function logToSheet(data) {
            try {
                const payload = {
                    timestamp: new Date().toISOString(),
                    sessionId: state.sessionId,
                    userId: state.userId,
                    userEmail: state.userEmail,
                    userName: state.userName,
                    turno: data.turno,
                    fase: data.fase,
                    speaker: data.speaker,
                    tipo: data.tipo,
                    actividad: data.actividad || '',
                    texto: data.texto || '',
                    latencia: data.latencia || 0,
                    indicadores: data.indicadores || ''
                };

                console.log('📊 Logging to sheet:', payload);

                await fetch(CONFIG.SHEETS_WEBHOOK, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: JSON.stringify(payload)
                });

                console.log('✅ Logged to sheet');
            } catch (error) {
                console.error('Sheet logging error:', error);
            }
        }

        function showMiraText(text) {
            state.currentMiraText = text;
            const dialogue = document.getElementById('dialogueArea');
            dialogue.innerHTML = '';
            
            const div = document.createElement('div');
            div.className = 'mira-text';
            div.textContent = text;
            dialogue.appendChild(div);
        }

        function showStudentText(text) {
            const dialogue = document.getElementById('dialogueArea');
            const div = document.createElement('div');
            div.className = 'student-text';
            div.textContent = text;
            dialogue.appendChild(div);
        }

        function showTyping() {
            const dialogue = document.getElementById('dialogueArea');
            const div = document.createElement('div');
            div.id = 'typingIndicator';
            div.className = 'typing-dots';
            div.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';
            dialogue.appendChild(div);
        }

        function hideTyping() {
            document.getElementById('typingIndicator')?.remove();
        }

        function clearDialogue() {
            document.getElementById('dialogueArea').innerHTML = '';
        }

        function updateStatus(text, type = '') {
            const el = document.getElementById('statusText');
            el.textContent = text;
            el.className = `status ${type === 'active' ? 'active' : type === 'error' ? 'warning' : ''}`;
        }

        function updatePhase(phase) {
            const labels = { 1: 'Planificación', 2: 'Ejecución', 3: 'Reflexión' };
            document.getElementById('phaseIndicator').textContent = `Fase ${phase}: ${labels[phase]}`;
        }

        function setMicState(state) {
            const btn = document.getElementById('micButton');
            btn.className = `mic-button ${state}`;
            btn.disabled = state !== 'available';

            if (state === 'available') {
                btn.onmousedown = startRecording;
                btn.onmouseup = stopRecording;
                btn.ontouchstart = (e) => { e.preventDefault(); startRecording(); };
                btn.ontouchend = (e) => { e.preventDefault(); stopRecording(); };
            }
        }

        window.addEventListener('DOMContentLoaded', initGoogleAuth);
    </script>

</body>
</html>
